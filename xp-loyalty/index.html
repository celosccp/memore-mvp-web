<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loyalty XP Digital</title>
<style>
:root{
  --y:#FFC709; --y2:#FFE27A; --bk:#0B0B0C; --s1:#161618; --s2:#202024; --s3:#2C2C31;
  --tx:#F4F4F2; --mut:#A3A3A8; --dim:#6E6E75; --ok:#55D38A; --warn:#FF9F43; --line:#2A2A2F;
  --stage:#E9E8E4; --ink:#141414; --pmut:#62625E; --pline:#DAD9D4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
#stage{display:flex;height:100dvh}

/* ---------- Painel da demonstração ---------- */
#panel{width:340px;flex:none;background:#fff;border-right:1px solid var(--pline);display:flex;flex-direction:column;z-index:30}
.ph{padding:16px 18px 10px}
.ph h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.ph p{margin:0;font-size:12px;color:var(--pmut)}
.ptabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--pline)}
.ptabs button{padding:9px 8px;font-size:13px;font-weight:600;color:var(--pmut);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--ink);border-color:var(--ink)}
.pbody{flex:1;overflow:auto;padding:14px 18px 28px;-webkit-overflow-scrolling:touch}
.pbody h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--pmut);margin:18px 0 8px;font-weight:700}
.pbody h2:first-child{margin-top:2px}
.seg{display:flex;background:#EFEEEA;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;color:var(--pmut)}
.seg button.on{background:var(--ink);color:#fff}
.hint{font-size:12px;color:var(--pmut);margin:6px 0 0}
.prof{display:block;width:100%;border:1px solid var(--pline);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.prof.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#FFFBE8}
.prof b{display:block;font-size:13px}
.prof span{font-size:12px;color:var(--pmut)}
.sl{margin-bottom:10px}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.sl output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.pbtn{display:block;width:100%;border:1px solid var(--pline);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:6px;background:#fff}
.pbtn.hot{background:var(--y);border-color:var(--y)}
.pbtn small{display:block;font-weight:400;color:var(--pmut);font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 .pbtn{margin:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0}
.tog input{width:20px;height:20px;accent-color:var(--ink)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0}
.fld input{width:76px;padding:6px 8px;border:1px solid var(--pline);border-radius:8px;font:inherit;text-align:right}
.fld.txt{display:block}
.fld.txt input{width:100%;text-align:left;margin-top:3px}
.pbody ol,.pbody ul{margin:0;padding-left:18px;font-size:13px}
.pbody li{margin-bottom:8px}
.pbody li b{font-weight:650}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:#EFEEEA;color:var(--pmut);margin-right:4px;vertical-align:1px}
#panelToggle{display:none;position:fixed;left:12px;bottom:12px;z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* ---------- Telefone ---------- */
#phoneWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:14px}
#phone{width:390px;height:min(844px,calc(100dvh - 28px));background:var(--bk);color:var(--tx);border-radius:46px;border:9px solid #000;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{flex:none;height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600}
.status i{font-style:normal;letter-spacing:1px;font-size:11px;color:var(--mut)}
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 10px;min-height:46px}
.hd h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
.hd .back{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:18px}
.scr{flex:1;overflow:auto;padding:2px 16px 22px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:#0E0E10;padding:6px 8px 16px}
.tabs button{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--dim);padding:5px 0}
.tabs button svg{display:block;margin:0 auto 3px}
.tabs button.on{color:var(--y)}
h3.sec{font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 9px;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline}
h3.sec button{color:var(--y);font-size:13px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.card + .card{margin-top:10px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--s3);color:var(--tx);white-space:nowrap}
.chip.ok{background:rgba(85,211,138,.16);color:var(--ok)}
.chip.y{background:var(--y);color:#000}
.chip.warn{background:rgba(255,159,67,.16);color:var(--warn)}
.chip.ghost{background:transparent;border:1px solid var(--s3);color:var(--mut)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.saldo{background:var(--y);color:#000;border-radius:22px;padding:16px 16px 12px}
.saldo .lbl{font-size:13px;font-weight:600;opacity:.75}
.saldo .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.saldo .big small{font-size:16px;font-weight:700;letter-spacing:0;margin-left:4px}
.saldo .bar{height:8px;border-radius:6px;background:rgba(0,0,0,.16);margin:10px 0 9px;overflow:hidden;display:flex}
.saldo .bar i{background:#000;border-radius:6px}
.saldo .cols{display:flex;gap:18px;font-size:13px}
.saldo .cols b{font-size:17px;margin-right:4px}
.saldo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#000;margin-right:5px}
.saldo .dot.o{background:rgba(0,0,0,.2)}
.saldo .lnk{display:block;width:100%;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.14);font-size:13px;font-weight:700}
.strip{position:sticky;top:-2px;z-index:5;background:var(--bk);padding:4px 0 10px;margin-bottom:2px}
.strip>div{display:flex;background:var(--y);color:#000;border-radius:14px;padding:9px 14px;font-size:13px;gap:16px;align-items:center}
.strip b{font-size:17px;margin-right:3px}

.ban{display:flex;gap:10px;align-items:flex-start;width:100%;border-radius:16px;padding:12px 14px;margin-top:10px;background:var(--s2);border:1px solid var(--line);font-size:13.5px}
.ban .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--s3);font-size:13px}
.ban.warn{border-color:rgba(255,159,67,.5)} .ban.warn .ic{background:var(--warn);color:#000}
.ban.ok{border-color:rgba(85,211,138,.45)} .ban.ok .ic{background:var(--ok);color:#000}
.ban.y{border-color:var(--y)} .ban.y .ic{background:var(--y);color:#000}
.ban b{display:block}
.ban span{color:var(--mut)}
.ban em{font-style:normal;color:var(--y);font-weight:600;display:block;margin-top:3px}

.plast{width:74px;height:47px;border-radius:8px;flex:none;position:relative;overflow:hidden;font-size:9px;font-weight:800;letter-spacing:.06em;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between}
.plast.one{background:linear-gradient(135deg,#8C8C92,#4A4A50);color:#fff}
.plast.infinite{background:linear-gradient(135deg,#2A2A2E,#000);color:var(--y);box-shadow:inset 0 0 0 1px #4a3f12}
.plast::after{content:"";width:13px;height:9px;border-radius:2px;background:rgba(255,255,255,.55);align-self:flex-start}
.plast.infinite::after{background:var(--y)}
.plast.lg{width:100%;height:150px;border-radius:16px;font-size:16px;padding:16px}
.plast.lg::after{width:30px;height:22px;border-radius:5px}
.row{display:flex;align-items:center;gap:12px}
.row .g{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--mut);flex:none;max-width:55%}
.kv span:last-child{text-align:right;font-weight:600}
.kv span:only-child{text-align:left;font-weight:400}
.kv.tot span{color:var(--tx);font-weight:800}
.prog{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--y);border-radius:4px}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:var(--y);color:#000;margin-top:10px}
.btn.sec{background:var(--s3);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--y);padding:10px}
.btn.demo{background:transparent;border:1.5px dashed var(--dim);color:var(--mut);font-size:13px;padding:10px}
.btn[disabled]{opacity:.4}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li:last-child{padding-bottom:2px}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-size:14.5px;font-weight:650}
.li .g span{font-size:12.5px;color:var(--mut);display:block}
.li .chev{color:var(--dim);font-size:18px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--s3);display:grid;place-items:center;flex:none;color:var(--y)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);margin-top:8px}
.opt.sel{border-color:var(--y);background:#1d1a0c}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.opt.sel .rd{border-color:var(--y)} .opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--y)}
.opt .g{flex:1} .opt .g b{display:block;font-size:15.5px} .opt .g span{font-size:12.5px;color:var(--mut)}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px 14px;background:#0E0E10}
.foot .imp{font-size:13px;color:var(--mut);text-align:center}
.foot .imp b{color:var(--tx)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;font-size:13px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cmp>div{padding:9px 10px;border-top:1px solid var(--line);background:var(--s1)}
.cmp>div:nth-child(-n+3){border-top:0;font-weight:700;background:var(--s2)}
.cmp>div:nth-child(3n+1){color:var(--mut)}
.cmp .cur{box-shadow:inset 2px 0 0 var(--y)}
.steps{display:flex;margin:14px 0 4px}
.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--dim);position:relative;padding-top:20px;font-weight:600}
.steps div::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--s3);z-index:1}
.steps div::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--s3)}
.steps div:first-child::after{display:none}
.steps div.done{color:var(--tx)} .steps div.done::before,.steps div.done::after{background:var(--y)}
.steps div.now{color:var(--y)} .steps div.now::before{background:var(--y);box-shadow:0 0 0 4px rgba(255,199,9,.25)} .steps div.now::after{background:var(--y)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 12px}
.swap>div{background:var(--s2);border-radius:14px;padding:11px 12px}
.swap>div.new{background:#1d1a0c;border:1.5px solid var(--y)}
.swap small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.swap b{font-size:15px;display:block;margin:2px 0}
.swap span{font-size:12px;color:var(--mut)}
.hero{background:#1d1a0c;border:1.5px solid var(--y);border-radius:16px;padding:14px;margin-bottom:12px}
.hero small{font-size:11px;color:var(--y);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.hero b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.note{font-size:12.5px;color:var(--mut);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:10px}
.premissa{font-size:11.5px;color:var(--dim);margin-top:8px}
.premissa::before{content:"Premissa do protótipo · ";font-weight:700}

/* bottom sheet */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;animation:fd .18s}
.sheet{background:var(--s1);width:100%;max-height:90%;border-radius:26px 26px 0 0;padding:8px 18px 22px;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--s3);margin:2px auto 14px}
.sheet h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sheet p{margin:0 0 12px;color:var(--mut);font-size:14px}
.sheet .card{background:var(--s2)}
@keyframes fd{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
.okc{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#000;display:grid;place-items:center;font-size:28px;font-weight:800;margin:6px auto 12px}
.okc.wait{background:var(--s3);color:var(--y)} .okc.wait .spin{width:24px;height:24px;border-width:3px}
.ctr{text-align:center}

@media (max-width:920px){
  #panel{position:fixed;inset:0 auto 0 0;max-width:88vw;transform:translateX(-102%);transition:transform .22s}
  #panel.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #panelToggle{display:block}
}
@media (max-width:480px){
  #phoneWrap{padding:0}
  #phone{width:100%;height:100dvh;border:0;border-radius:0}
  .status{display:none}
  #panelToggle{bottom:auto;top:8px;left:auto;right:10px;padding:6px 12px;opacity:.85}
}

/* ===== Tema inspirado nas telas de Design ===== */
:root{--ok:#7BE3A8;--s1:rgba(255,255,255,.065);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.13);--line:rgba(255,255,255,.09)}
#phone{background:radial-gradient(130% 48% at 22% 0%,#57401a 0%,#2a1e0e 34%,#0b0b0c 72%) #0b0b0c}
.hd{padding:8px 16px 12px;gap:12px}
.hd h1{font-size:16px;font-weight:650;letter-spacing:0}
.hd .back{width:38px;height:38px;background:rgba(255,255,255,.1);font-size:16px}
.card{border-radius:22px;border-color:rgba(255,255,255,.05)}
.btn{border-radius:999px}
.opt{background:rgba(255,255,255,.04);border-radius:18px}
.opt.sel{background:rgba(255,199,9,.1)}
.foot{background:#100e0b}
.sheet{background:#1b1815}
.hero,.swap>div.new{background:rgba(255,199,9,.1)}
.chip.av{background:var(--ok);color:#062b17}
.chip.use{background:rgba(255,199,9,.16);color:var(--y)}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.d.y{background:var(--y)} .d.g{background:var(--ok)}
.bal{padding:4px 2px 0}
.bal .n{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.bal .n small{font-size:26px;font-weight:800}
.bal .bar{height:5px;border-radius:4px;background:rgba(255,255,255,.14);margin:10px 0 8px;display:flex;gap:3px;overflow:hidden}
.bal .bar i{border-radius:4px} .bal .bar .u{background:var(--y)} .bal .bar .a{background:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:20px;margin-top:12px}
.split>div{padding:12px 10px;text-align:center}
.split>div+div{border-left:1px solid rgba(255,255,255,.12)}
.split span{display:block;font-size:12.5px;color:var(--mut)}
.split b{font-size:18px;letter-spacing:-.01em}
.go{display:flex;justify-content:space-between;width:100%;padding:14px 6px 4px;font-weight:700;font-size:14.5px}
.ttabs{display:flex;position:sticky;top:-2px;z-index:6;margin:10px -16px 0;padding:0 16px;background:rgba(14,12,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ttabs button{flex:1;text-align:center;padding:13px 0 12px;font-weight:650;font-size:14.5px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.ttabs button.on{color:var(--tx);border-color:#fff}
.ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--y) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#1d1914}
.ring>*{position:relative;font-size:12px;font-weight:700}
.plast.one{background:linear-gradient(135deg,#3a3a3e,#131314);color:#cfcfd2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.plast.infinite{background:linear-gradient(120deg,#b9b9bb,#77777a 55%,#9c9c9f);color:#111;box-shadow:none}
.plast.infinite::after{background:rgba(0,0,0,.45)}
.wel{flex:1;display:flex;flex-direction:column;padding:0 22px 22px;position:relative;overflow:auto;scrollbar-width:none}
.wel .art{position:absolute;inset:0 0 auto 0;width:100%;height:250px;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.wel .hd,.wel .logo,.wel h2{position:relative}
.wel .logo{width:58px;height:50px;border-radius:9px;background:#fff;color:#111;font-weight:900;font-size:22px;letter-spacing:-.04em;display:grid;place-items:center;margin:14px auto 96px}
.wel h2{font-size:25px;line-height:1.18;letter-spacing:-.02em;margin:0}
.wel .num{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pks{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pks::-webkit-scrollbar{display:none}
.pk{flex:0 0 86%;scroll-snap-align:center;background:var(--s1);border:1.5px solid rgba(255,255,255,.06);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pk.cur{border-color:rgba(255,199,9,.6);background:rgba(255,199,9,.06)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)} .dots i.on{background:#fff;width:16px;border-radius:3px}
.pk.lock .plast{filter:grayscale(1) brightness(.6)}
.pk.lock .kv span:last-child{color:var(--mut)}
.chip svg{flex:none}

/* ===== Vidro fosco, acordeões e um momento de vitória ===== */
[hidden]{display:none!important}
#phone{background:radial-gradient(90% 38% at 105% 64%,rgba(150,104,30,.34),transparent 70%),radial-gradient(70% 30% at -10% 96%,rgba(120,84,28,.26),transparent 70%),radial-gradient(130% 48% at 22% 0%,#57401a 0%,#2a1e0e 34%,#0b0b0c 72%) #0b0b0c}
.card,.pk,.split,.ban,.opt{-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ov{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{background:rgba(36,30,23,.72);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border-top:1px solid rgba(255,255,255,.16);box-shadow:0 -12px 44px rgba(0,0,0,.45)}
.sheet .card,.sheet .split{-webkit-backdrop-filter:none;backdrop-filter:none}
.foot{background:rgba(20,16,12,.66);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.ttabs{background:rgba(16,13,10,.6);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 4px 12px;margin-top:10px;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
.acc span:last-child{font-size:18px}
.okc:not(.wait){animation:pop .55s cubic-bezier(.2,1.5,.4,1),halo 1.1s ease-out .1s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes halo{from{box-shadow:0 0 0 0 rgba(123,227,168,.55)}to{box-shadow:0 0 0 26px rgba(123,227,168,0)}}
@media (prefers-reduced-motion:reduce){.okc,.ov,.sheet{animation:none!important}}
.h2b{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;width:100%;display:flex;justify-content:space-between}
.glab{font-size:11.5px;color:var(--pmut);margin:8px 0 5px}
.pbody .grid2{margin-bottom:2px}
</style>
</head>
<body>
<div id="stage">
  <aside id="panel"></aside>
  <main id="phoneWrap">
    <div id="phone">
      <div class="status"><span>9:41</span><i>●●●● 5G ▮</i></div>
      <div id="app"></div>
    </div>
  </main>
</div>
<button id="panelToggle" data-a="panel">Demo</button>

<script>
/* =====================================================================
   Protótipo navegável · Benefícios e Loyalty Digital
   Todos os valores abaixo são premissas editáveis, não regras finais.
   ===================================================================== */

// ---------- Premissas parametrizáveis ----------
const P = {
  corte: 30000,          // corte patrimonial do Infinite
  infPts: 10,            // Infinite por fichas (cenário B)
  corrPts: 15,           // Corretagem zero, corte único
  cofre: [10, 15, 30],   // Cofrinho Turbo 110/115/125
  ibOne: [5, 10],        // Investback One 1,0 / 1,1
  ibInf: [10, 15],       // Investback Infinite 1,2 / 1,5
  oneMin: 2500,          // gasto mínimo p/ Investback do One
  cartaoPor: 500, cartaoMax: 15,
  aucBloco: 5000, aucMax: 10,
  ciclo: 'mensal',
  salaOne: 'Não inclui',
  salaInf: '4 acessos por ano, com gasto mínimo no cartão (a confirmar)',
  corrCob: 'Cobertura a confirmar (ex.: ações, FIIs e ETFs pelo app)',
  salaPts: 10, salaQtd: 2, legRate: 110, legAte: '30/04/2027',
};

const PROFILES = {
  p1: { nome: 'Marina', auc: 25000, gasto: 7500, rec: ['of','aporte','sal','pag'], inf: 'none',
        resumo: 'R$ 25 mil investidos · R$ 7.500/mês no cartão' },
  p2: { nome: 'Rafael', auc: 40000, gasto: 400, rec: ['cartao','of','aporte','auc'], inf: 'active',
        resumo: 'R$ 40 mil investidos · pouco uso dos demais produtos', goal: {fam:'cofrinho', opt:'c110'} },
  p3: { nome: 'Jô', auc: 8000, gasto: 300, rec: ['of','pag','aporte','sal'], inf: 'none',
        resumo: 'R$ 8 mil investidos · zero ficha' },
};

const CTX = ['Planejamento financeiro', 'Comece a poupar', 'Otimize seu dia a dia', 'Acelere e proteja seus planos'];
// pts de comportamentos fora de cartão e patrimônio são ILUSTRATIVOS (régua em calibração)
const BEH = [
  { id:'of',     ctx:0, nome:'Conectar outras contas', sub:'Open Finance', pts:3, como:'Traga os dados de outros bancos e veja tudo em um só lugar.', esforco:'Leva uns 5 minutos e não tem custo.', cta:'Conectar contas' },
  { id:'auc',    ctx:1, nome:'Patrimônio investido', dyn:true },
  { id:'aporte', ctx:1, nome:'Aporte recorrente', pts:3, como:'Programe um valor para investir todo mês. Você escolhe quanto e pode mudar quando quiser.', esforco:'A partir de R$ 100 por mês (valor a confirmar).', cta:'Programar aporte' },
  { id:'prev',   ctx:1, nome:'Previdência', pts:3, como:'Tenha um plano de previdência na XP.', esforco:'Vale para quem já pensa em longo prazo.', cta:'Conhecer previdência' },
  { id:'cartao', ctx:2, nome:'Gasto no cartão', dyn:true },
  { id:'pag',    ctx:2, nome:'Pagar contas pelo app', pts:2, como:'Pague boletos e contas do mês pela conta XP.', esforco:'Você já paga essas contas. Só muda o lugar.', cta:'Pagar uma conta' },
  { id:'sal',    ctx:2, nome:'Receber o salário na XP', sub:'Portabilidade de salário', pts:5, como:'Traga seu salário para a conta XP, sem custo.', esforco:'Pedido feito pelo app. Seu empregador não precisa fazer nada.', cta:'Trazer meu salário' },
  { id:'cambio', ctx:2, nome:'Câmbio', pts:1, como:'Compre moeda ou use a conta internacional quando for viajar.', esforco:'Só quando você precisar.', cta:'Ver câmbio' },
  { id:'cred',   ctx:3, nome:'Crédito', pts:2, need:true, como:'Se você já tem um plano que precisa de crédito, contratar na XP também conta fichas.', cta:'Contar o que eu preciso' },
  { id:'cons',   ctx:3, nome:'Consórcio', pts:2, need:true, como:'Se você planeja comprar um bem sem pressa, o consórcio também conta fichas.', cta:'Contar o que eu preciso' },
  { id:'seg',    ctx:3, nome:'Seguros', pts:2, como:'Proteja o que é importante para você: vida, casa ou celular.', esforco:'Compare coberturas e preços antes de decidir.', cta:'Ver seguros' },
  { id:'segcc',  ctx:3, nome:'Seguro Conta e Cartão', pts:1, optional:true, como:'Proteção para transações na conta e no cartão.', esforco:'Alavanca em avaliação.', cta:'Ver o seguro' },
];
const beh = id => BEH.find(b => b.id === id);

// ---------- Estado ----------
const S = { scen:'A', prof:'p1', tab:'demo', legacy:false, legRule:'preservar', segcc:false, salaFichas:false, open:{} };
let timers = [];

function loadProfile(id){
  timers.forEach(clearTimeout); timers = [];
  const p = PROFILES[id];
  Object.assign(S, { prof:id, auc:p.auc, gasto:p.gasto, done:{}, active:{}, inf:p.inf,
    infVia: p.inf==='active' ? 'patrimonio' : null, goal: p.goal ? {...p.goal} : null,
    screen:'home', pk:null, param:null, sel:null, sheet:null, released:0, ibNotice:null, seen:{}, cond:false });
}

// ---------- Regras ----------
const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const pt  = n => n + (Math.abs(n) === 1 ? ' ficha' : ' fichas');
const cardName = c => c === 'infinite' ? 'XP Infinite' : 'XP One';
const activeCard = () => S.inf === 'active' ? 'infinite' : 'one';
const elig = () => S.auc >= P.corte;

const ptsCartao = () => Math.min(Math.floor(S.gasto / P.cartaoPor), P.cartaoMax);
const ptsAuc    = () => Math.min(Math.max(Math.floor((S.auc - P.corte) / P.aucBloco), 0), P.aucMax);
function behPts(b){ return b.id==='cartao' ? ptsCartao() : b.id==='auc' ? ptsAuc() : (S.done[b.id] ? b.pts : 0); }
const visibleBeh = () => BEH.filter(b => !b.optional || S.segcc);
const total = () => visibleBeh().reduce((s,b) => s + behPts(b), 0);

const IB = { one: () => [ {id:'o10', label:'1,0% de Investback', rate:1.0, price:P.ibOne[0]}, {id:'o11', label:'1,1% de Investback', rate:1.1, price:P.ibOne[1]} ],
             infinite: () => [ {id:'i12', label:'1,2% de Investback', rate:1.2, price:P.ibInf[0]}, {id:'i15', label:'1,5% de Investback', rate:1.5, price:P.ibInf[1]} ] };
function families(card = activeCard()){
  return [
    { id:'cofrinho', nome:'Cofrinho Turbo', desc:'O dinheiro guardado no Cofrinho rende mais.',
      opts:[ {id:'c110', label:'110% do CDI', price:P.cofre[0]}, {id:'c115', label:'115% do CDI', price:P.cofre[1]}, {id:'c125', label:'125% do CDI', price:P.cofre[2]} ] },
    { id:'investback', nome:'Investback turbinado', desc:`Mais dinheiro de volta nas compras do ${cardName(card)}.`, card, opts: IB[card]() },
    { id:'corretagem', nome:'Corretagem zero', desc:'Invista na bolsa sem pagar corretagem.',
      opts:[ {id:'cz', label:'Corretagem zero', price:P.corrPts} ] },
    ...(S.salaFichas && card === 'one' ? [{ id:'salavip', nome:'Sala VIP', desc:'Acessos a salas VIP em aeroportos, que o XP One não inclui.',
      opts:[ {id:'sv', label:`${P.salaQtd} acessos por ano`, price:P.salaPts} ] }] : []),
  ];
}
const fam = id => families().find(f => f.id === id);
function optOf(famId, optId){
  const pool = famId === 'investback' ? [...IB.one(), ...IB.infinite()] : fam(famId).opts;
  return pool.find(o => o.id === optId);
}
const infByPoints = () => S.inf !== 'none' && S.infVia === 'fichas';
function allocated(){
  let a = infByPoints() ? P.infPts : 0;
  for (const f in S.active) a += optOf(f, S.active[f].opt).price;
  return a;
}
const available = () => Math.max(0, total() - allocated());
const deficit   = () => Math.max(0, allocated() - total());
const cardAtRisk = () => S.inf === 'active' && S.infVia === 'patrimonio' && !elig();
// fichas que faltam para escolher uma opção (considera a liberação da opção atual da mesma família)
function missing(famId, optId){
  const cur = S.active[famId];
  const back = cur ? optOf(famId, cur.opt).price : 0;
  return Math.max(0, optOf(famId, optId).price - (total() - allocated()) - back);
}
const baseRate = c => c === 'infinite' ? 1.0 : 0.8;
function investbackNow(){
  const c = activeCard(), a = S.active.investback;
  const rate = a && a.status === 'active' ? optOf('investback', a.opt).rate : baseRate(c);
  const applies = c === 'infinite' || S.gasto >= P.oneMin;
  return { rate, applies, valor: applies ? S.gasto * rate / 100 : 0 };
}
const pct = r => r.toFixed(1).replace('.', ',') + '%';

// mantém o estado coerente depois de qualquer mudança
function reconcile(){
  if (S.inf !== 'none' && S.infVia === 'fichas' && S.scen === 'A'){ S.inf = 'none'; S.infVia = null; }
  if (S.active.salavip && !(S.salaFichas && activeCard() === 'one')){ S.ibNotice = { label:'Sala VIP por fichas', price:P.salaPts, sv:true }; delete S.active.salavip; }
  if (S.goal && S.goal.fam === 'salavip' && !fam('salavip')) S.goal = null;
  if (S.screen === 'fam' && !fam(S.param)){ S.screen = 'shelf'; S.param = null; }
  if (S.sheet && S.sheet.fam && !fam(S.sheet.fam)) S.sheet = null;
  if (S.scen === 'A' && S.infVia === 'fichas'){ S.inf = 'none'; S.infVia = null; }
  if (infByPoints() && elig()){           // transição no corte patrimonial (cenário B)
    S.infVia = 'patrimonio'; S.released = P.infPts; S.sheet = {t:'transB'};
  }
  const a = S.active.investback;          // Investback turbinado pertence a um cartão
  if (a && !IB[activeCard()]().some(o => o.id === a.opt)){
    const o = optOf('investback', a.opt);
    S.ibNotice = { label:o.label, price:o.price }; delete S.active.investback;
  }
  if (S.goal && S.goal.fam === 'investback' && !IB[activeCard()]().some(o => o.id === S.goal.opt)) S.goal = null;
}

// sugestões de próximo passo, na ordem pensada para o perfil
function suggestions(n = 3){
  const out = [];
  for (const id of PROFILES[S.prof].rec){
    const b = beh(id);
    if (id === 'cartao'){
      if (ptsCartao() >= P.cartaoMax) continue;
      const falta = P.cartaoPor - (S.gasto % P.cartaoPor);
      out.push({ id, gain:1, t:'Concentrar compras no cartão', d:`Mais ${brl(falta)} no mês valem 1 ficha. Use o cartão no que você já compra.` });
    } else if (id === 'auc'){
      if (ptsAuc() >= P.aucMax) continue;
      if (!elig()) out.push({ id, gain:0, t:`Chegar a ${brl(P.corte)} investidos`, d:`Faltam ${brl(P.corte - S.auc)}. Libera o pedido do XP Infinite.` });
      else { const falta = P.aucBloco - ((S.auc - P.corte) % P.aucBloco); out.push({ id, gain:1, t:'Investir um pouco mais', d:`Faltam ${brl(falta)} investidos para ganhar 1 ficha.` }); }
    } else if (!S.done[id]) out.push({ id, gain:b.pts, t:b.nome, d:b.esforco });
  }
  return out.slice(0, n);
}

// combinações que cabem no saldo total (uma opção por família)
function combos(){
  const tot = total(), res = [];
  const infChoices = (S.scen === 'B' && !elig()) ? [false, true] : [null];
  for (const inf of infChoices){
    const card = inf === true ? 'infinite' : inf === false ? 'one' : activeCard();
    const fs = families(card), base = inf ? P.infPts : 0;
    if (base > tot) continue;
    const rec = (i, picks, cost) => {
      if (i === fs.length){
        const left = tot - cost;
        const maximal = fs.every((f, k) => picks[k] || f.opts[0].price > left);
        if (maximal && (picks.some(Boolean) || inf)) res.push({ inf, card, items: picks.filter(Boolean), cost, left });
        return;
      }
      rec(i + 1, [...picks, null], cost);
      for (const o of fs[i].opts) if (cost + o.price <= tot) rec(i + 1, [...picks, {fam:fs[i].nome, ...o}], cost + o.price);
    };
    rec(0, [], base);
  }
  return res.sort((a,b) => (b.inf===true) - (a.inf===true) || b.items.length - a.items.length || a.left - b.left).slice(0, 6);
}

// ---------- Ícones ----------
const I = {
  lock:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  salavip:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18v-6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6M3 18h18M5 14h14M9 9V6h6v3"/></svg>',
  cofrinho:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a7 6 0 0 1 14-1l2 1v4l-2 1a7 6 0 0 1-2 2v2h-3v-1H9v1H6v-2a6 6 0 0 1-2-4z"/><path d="M9 8h4"/></svg>',
  investback:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M14 15l-3 0m0 0 1.5-1.5M11 15l1.5 1.5"/></svg>',
  corretagem:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 7"/></svg>',
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
  shelf:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l2.4 5 5.6.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-.8z"/></svg>',
};

// ---------- Componentes ----------
const isOpen = (k, def = false) => S.open[k] ?? def;
const accHead = (k, t) => `<button class="acc" data-a="tog:${k}:0"><span>${t}</span><span class="mut">${isOpen(k) ? '−' : '+'}</span></button>`;
const chip = (t, k = '') => `<span class="chip ${k}">${t}</span>`;
const plast = (c, lg) => `<div class="plast ${c} ${lg ? 'lg' : ''}"><span>${c === 'infinite' ? 'XP INFINITE' : 'XP ONE'}</span></div>`;

const ring = (p, inner = '') => `<div class="ring" style="--p:${Math.round(Math.min(1, p) * 100)}">${inner}</div>`;
function bal(){
  const t = total(), al = allocated(), av = available(), base = Math.max(t, al, 1);
  return `<div class="bal"><div class="n">${t} <small>${t === 1 ? 'ficha' : 'fichas'}</small></div>
    <div class="bar"><i class="u" style="width:${al / base * 100}%"></i><i class="a" style="width:${av / base * 100}%"></i></div>
    <div class="xs mut">${t === 0 && al === 0 ? 'Você ainda não tem fichas, e tudo bem: seu cartão já tem benefícios valendo. Fichas servem para ativar benefícios extras.' : 'Recalculadas todo mês com o que você faz na XP.'}</div>
    <div class="split"><div><span><i class="d y"></i>Em uso</span><b>${pt(al)}</b></div><div><span><i class="d g"></i>Disponíveis</span><b>${pt(av)}</b></div></div></div>`;
}
const strip = () => '';
const canActivate = () => families().some(f => !S.active[f.id] && missing(f.id, f.opts[0].id) === 0)
  || (S.scen === 'B' && !elig() && S.inf === 'none' && available() >= P.infPts);
const hubTabs = () => `<div class="ttabs">${[['home', 'Resumo'], ['shelf', 'Usar'], ['juntar', 'Juntar']].map(([id, t]) =>
  `<button class="${S.screen === id ? 'on' : ''}" data-a="go:${id}">${id === 'shelf' && canActivate() ? '<i class="d y"></i>' : ''}${t}</button>`).join('')}</div>`;

function banners(){
  const out = [];
  const B = (k, ic, t, d, act, cta) => out.push(`<button class="ban ${k}" data-a="${act}"><div class="ic">${ic}</div><div><b>${t}</b><span>${d}</span>${cta ? `<em>${cta} ›</em>` : ''}</div></button>`);
  if (deficit() > 0) B('warn', '!', `Faltam ${pt(deficit())} para manter seus benefícios`, 'Suas fichas diminuíram. Nada muda agora: veja o prazo e suas opções.', 'sheet:loss', 'Ver o que fazer');
  if (cardAtRisk()) B('warn', '!', `Seu patrimônio está abaixo de ${brl(P.corte)}`, 'Seu XP Infinite continua ativo por enquanto. Veja como manter.', 'sheet:lossCard', 'Ver como manter');
  if (S.released) B('ok', '✓', `${pt(S.released)} voltaram para o seu saldo`, `Você chegou a ${brl(P.corte)} investidos. Seu XP Infinite agora vem do seu patrimônio.`, 'sheet:transB', 'Entender a mudança');
  if (elig() && S.inf === 'none') B('y', '★', 'Você já pode pedir o XP Infinite', `Você chegou a ${brl(P.corte)} investidos. O pedido é feito por você, quando quiser.`, 'go:pacote', 'Ver o pacote e pedir');
  if (S.inf === 'requested') B('', '…', 'XP Infinite em análise', 'Você continua com o XP One até o novo cartão ser ativado.', 'go:pacote', 'Acompanhar');
  if (S.ibNotice) B('', 'i', `${pt(S.ibNotice.price)} voltaram para o seu saldo`, `Seu cartão mudou. ${S.ibNotice.sv ? 'A Sala VIP por fichas' : 'O Investback turbinado de ' + S.ibNotice.label.split(' ')[0]} era do cartão anterior e foi encerrado.`, 'ibnotice', 'Escolher a opção do novo cartão');
  if (S.legacy && !S.active.cofrinho) B('', 'i', 'Seu Cofrinho no novo programa', legacyCopy().short, 'sheet:legacy', 'Entender');
  return out.join('');
}

function legacyCopy(){
  const r = S.legRule, need = Math.max(0, P.cofre[0] - available());
  if (r === 'preservar') return { short:`Você mantém ${P.legRate}% do CDI sem usar fichas.`, status:`Ativo · ${P.legRate}% do CDI`, k:'ok',
    muda:[`Nada muda na sua condição: ${P.legRate}% do CDI, sem usar fichas.`, `Para render mais (${fam('cofrinho').opts[1].label} ou ${fam('cofrinho').opts[2].label}), você pode usar fichas.`], acao:'Ver opções para render mais' };
  if (r === 'carencia') return { short:`Seus ${P.legRate}% do CDI estão garantidos até ${P.legAte}.`, status:`${P.legRate}% do CDI até ${P.legAte}`, k:'warn',
    muda:[`Até ${P.legAte}, tudo fica como está: ${P.legRate}% do CDI, sem usar fichas.`, `Depois dessa data, manter ${P.legRate}% do CDI passa a usar ${pt(P.cofre[0])}.`, need ? `Hoje faltam ${pt(need)} para você manter. Dá tempo de chegar lá.` : `Você já tem fichas para manter. Pode garantir agora ou esperar a data.`], acao: need ? 'Ver como ganhar fichas' : `Garantir com ${pt(P.cofre[0])}` };
  return { short:`O Cofrinho Turbo agora é ativado com fichas.`, status:`Precisa de ${pt(P.cofre[0])} para continuar`, k:'warn',
    muda:[`No novo programa, o Cofrinho só fica ativo com fichas em uso.`, `Para manter ${P.legRate}% do CDI, ative o Cofrinho Turbo com ${pt(P.cofre[0])}.`, need ? `Hoje faltam ${pt(need)}.` : `Você já tem fichas para ativar.`], acao: need ? 'Ver como ganhar fichas' : `Ativar com ${pt(P.cofre[0])}` };

function optState(f, o){
  const a = S.active[f.id];
  if (a && a.opt === o.id) return a.status === 'processing' ? chip('<i class="spin"></i> Ativando', 'y') : chip('Em uso', 'use');
  if (f.id === 'cofrinho' && S.legacy && !a && o.id === 'c110' && S.legRule !== 'migrar') return chip('Você já tem', 'ok');
  const m = missing(f.id, o.id);
  return m ? chip(`Faltam ${m}`, 'ghost') : (a ? chip('Trocar') : chip('Disponível', 'av'));
}

function goalCard(){

    if (!m) return `<div class="card"><div class="row">${ring(1, '<span>✓</span>')}<div class="g"><div class="xs mut b">TRILHA CONCLUÍDA</div><div class="b">${f.nome} · ${o.label}</div><div class="xs mut">Você já tem as ${pt(o.price)}.</div></div></div>
      <button class="btn" data-a="openfam:${f.id}:${o.id}">Ativar agora</button></div>`;
    head = `<div class="row">${ring(p, `<span>${Math.round(p * 100)}%</span>`)}<div class="g"><div class="xs mut b">TRILHA PARA DESBLOQUEAR</div><div class="b">${f.nome} · ${o.label}</div><div class="xs mut">Faltam ${pt(m)}. Você tem ${o.price - m} de ${o.price}.</div></div></div><div style="height:10px"></div>`;

function pkCard(k){
  const c = activeCard(), cur = c === k, ib = investbackNow();
  const kv = (a, b) => `<div class="kv"><span>${a}</span><span>${b}</span></div>`;
  let tag, foot = '';
  if (k === 'one'){
    tag = cur ? chip('Seu pacote', 'y') : chip('Pacote inicial', 'ghost');
    foot = cur ? kv('Seu mês até aqui', ib.applies ? `≈ ${brl(ib.valor)} de volta` : `faltam ${brl(P.oneMin - S.gasto)} em compras`) : '';
  } else {
    const near = S.auc >= P.corte * 0.6;
    tag = cur ? chip('Seu pacote', 'y') : S.inf === 'requested' ? chip('<i class="spin"></i> Em análise', 'y') : elig() ? chip('Desbloqueado · você já pode pedir', 'av') : chip(I.lock + ' Bloqueado', 'ghost');
    if (cur) foot = kv('Seu mês até aqui', `≈ ${brl(ib.valor)} de volta`) + (infByPoints() ? `<div class="xs mut" style="margin-top:8px">Acesso por fichas: ${P.infPts} em uso até você ter ${brl(P.corte)} investidos.</div>` : '');
    else if (S.inf === 'requested') foot = `<div class="xs mut" style="margin-top:8px">Você segue com o XP One até o novo cartão ser ativado.</div>`;
    else if (elig()) foot = `<div class="xs mut" style="margin-top:8px">Você tem ${brl(S.auc)} investidos. O pedido não usa fichas.</div>`;
    else foot = `<div class="xs mut b" style="margin-top:10px;letter-spacing:.04em">PARA DESBLOQUEAR</div>` + (near ? `<div class="prog"><i style="width:${S.auc / P.corte * 100}%"></i></div><div class="xs mut">Faltam ${brl(P.corte - S.auc)} investidos. Não usa fichas.</div>`
        : `<div class="xs mut" style="margin-top:4px">Tenha ${brl(P.corte)} investidos. Sem pressa: seu pacote atual já vale hoje.</div>`)
      + (S.scen === 'B' ? `<div class="xs" style="margin-top:6px;color:var(--y);font-weight:600">${available() >= P.infPts ? `Ou peça agora com ${pt(P.infPts)}` : `Ou com ${pt(P.infPts)} (faltam ${P.infPts - available()})`}</div>` : '');

    <div style="margin:10px 0 2px">${tag}</div>

  if (!sel) return `<div class="foot"><div class="imp">Você tem <b>${pt(available())} disponíveis</b>. Toque em uma opção.</div></div>`;
  if (a && a.opt === sel.id) return `<div class="foot"><div class="imp">Esta é a sua opção ativa.</div><button class="btn sec" data-a="sheet:deact:${f.id}" ${a.status === 'processing' ? 'disabled' : ''}>Desativar e liberar ${pt(sel.price)}</button></div>`;
  const m = missing(f.id, sel.id), back = a ? optOf(f.id, a.opt).price : 0, after = available() + back - sel.price;
  if (m) return `<div class="foot"><div class="imp">Faltam <b>${pt(m)}</b> para ${sel.label}.</div><button class="btn" data-a="sheet:confirm:${f.id}:${sel.id}">Ver como chegar lá</button></div>`;
  return `<div class="foot"><div class="imp">${a ? `Libera <b>${back}</b>, usa <b>${sel.price}</b>` : `Usa <b>${pt(sel.price)}</b>`} · ficam <b>${after} disponíveis</b></div>
    <button class="btn" data-a="sheet:confirm:${f.id}:${sel.id}">${a ? 'Trocar' : 'Continuar'}</button></div>`;
}

function juntar(){
  const t = total(), list = visibleBeh();
  const got = list.filter(b => behPts(b) > 0), sug = suggestions(3);
  const defCtx = sug.length ? beh(sug[0].id).ctx : 0;
  const mx = b => b.id === 'cartao' ? P.cartaoMax : b.id === 'auc' ? P.aucMax : b.pts;
  const detail = b => b.id === 'cartao' ? `${brl(S.gasto)} em compras no mês · 1 ficha a cada ${brl(P.cartaoPor)}`
    : b.id === 'auc' ? `${brl(S.auc)} investidos · 1 ficha a cada ${brl(P.aucBloco)} acima de ${brl(P.corte)}` : (b.sub || 'Concluído');
  return `
    <h3 class="sec" style="margin-top:14px">De onde vêm suas fichas</h3>
    <div class="card">${got.length ? got.map(b => `<button class="li" data-a="beh:${b.id}"><div class="g"><b>${b.nome}</b><span>${detail(b)}</span></div>${chip(pt(behPts(b)), 'use')}</button>`).join('')
        + `<div class="kv tot" style="border-top:1px solid var(--line);margin-top:2px"><span>Total neste mês</span><span>${pt(t)}</span></div>`
      : `<div class="sm mut">Você ainda não tem fichas. Elas vêm do que você faz na XP: guardar, usar o cartão, pagar contas. Comece por um desafio simples abaixo.</div>`}</div>

    ${sug.length ? `<h3 class="sec">Sugeridos para você</h3><div class="card">${sug.map(s => `<button class="li" data-a="beh:${s.id}"><div class="g"><b>${s.t}</b><span>${s.d}</span></div>${s.gain ? chip('+' + pt(s.gain), 'ghost') : ''}<span class="chev">›</span></button>`).join('')}</div>` : ''}

    <h3 class="sec">Todos os desafios</h3>
    <div class="xs mut" style="margin:-4px 2px 10px">Faça o que combina com você. Nenhum é obrigatório.</div>
    ${CTX.map((cx, i) => { const bs = list.filter(b => b.ctx === i), earned = bs.reduce((a, b) => a + behPts(b), 0), tot = bs.reduce((a, b) => a + mx(b), 0), done = bs.filter(b => behPts(b) >= mx(b)).length;
      const op = isOpen('ctx' + i, i === defCtx);
      return `<div class="card"><button class="row" style="width:100%" data-a="tog:ctx${i}:${i === defCtx ? 1 : 0}">${ring(earned / tot, `<span>${earned}</span>`)}<div class="g"><div class="b" style="font-size:16px">${cx}</div><div class="xs mut">${done}/${bs.length} ${bs.length === 1 ? 'desafio' : 'desafios'}</div></div>${i === 3 ? '' : earned < tot ? chip('+' + pt(tot - earned), 'ghost') : chip('Completo', 'use')}<span class="mut" style="font-size:18px;width:14px;text-align:center">${op ? '−' : '+'}</span></button><div ${op ? '' : 'hidden'} style="margin-top:10px">
      ${i === 3 ? `<div class="xs mut" style="margin-bottom:6px">Só fazem sentido se você já tem um plano que precisa deles. Veja as condições antes de decidir.</div>` : ''}
      ${bs.map(b => { const p = behPts(b), max = mx(b);
        return `<button class="li" data-a="beh:${b.id}"><div class="g"><b>${b.nome}</b><span>${b.dyn ? `${p} de ${max} fichas` : p ? 'Concluído' : b.need ? 'Se fizer sentido para você' : `Vale ${pt(b.pts)}`}</span></div>${p ? chip(p >= max ? '✓ ' + p : String(p), 'use') : ''}<span class="chev">›</span></button>`; }).join('')}
    </div></div>`; }).join('')}
    <div class="premissa">Régua em calibração. Fora de cartão e patrimônio, o número de fichas é ilustrativo.</div>`;
}

// ---------- Sheets ----------
function saldoRows(back, cost){
  const av = available();
  return `<div class="card">
    <div class="kv"><span>Disponíveis hoje</span><span>${pt(av)}</span></div>
    ${back ? `<div class="kv"><span>Liberadas da opção atual</span><span style="color:var(--ok)">+ ${back}</span></div>` : ''}
    ${cost ? `<div class="kv"><span>Usadas nesta escolha</span><span>− ${cost}</span></div>` : ''}
    <div class="kv tot"><span>Disponíveis depois</span><span>${pt(av + back - cost)}</span></div>
    <div class="kv"><span>Em uso depois</span><span>${pt(allocated() - back + cost)}</span></div></div>`;
}
function sugList(n){ return suggestions(n).map(s => `<button class="li" data-a="beh:${s.id}"><div class="g"><b>${s.t}</b><span>${s.d}</span></div>${s.gain ? chip('+' + s.gain, 'y') : ''}<span class="chev">›</span></button>`).join(''); }

let lastKey = '';

  if (S.screen === 'welcome'){ app.innerHTML = welcome(); lastKey = 'welcome'; return; }
  const isHub = ['home', 'shelf', 'juntar'].includes(S.screen);
  const key = S.screen + ':' + (S.param || '');
  const old = app.querySelector('.scr'), st = old && key === lastKey ? old.scrollTop : 0;
  const body = { home, pacote, shelf, juntar, fam: famScreen }[S.screen]();
  const hadSheet = !!app.querySelector('.ov');
  const cta = isHub && S.screen !== 'shelf' && canActivate() ? `<button class="go" data-a="go:shelf"><span>Você tem benefícios para ativar</span><span>›</span></button>` : '';
  app.innerHTML = `<div class="hd"><button class="back" data-a="back">←</button><h1>${isHub ? 'Loyalty XP Digital' : S.screen === 'fam' ? fam(S.param).nome : 'Meu cartão'}</h1></div>
    <div class="scr">${isHub ? bal() + cta + hubTabs() : ''}${body}</div>
    ${S.screen === 'fam' ? famFoot() : ''}
    ${sheet()}`;
  app.querySelector('.scr').scrollTop = st; lastKey = key;
  const pks = app.querySelector('.pks');
  if (pks){
    const w = () => pks.firstElementChild.offsetWidth + 10;
    pks.scrollLeft = +pks.dataset.idx * w();
    pks.addEventListener('scroll', () => { const i = Math.round(pks.scrollLeft / w()); S.pk = i;
      app.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive: true });
  }
  if (hadSheet && S.sheet){ const ov = app.querySelector('.ov'); ov.style.animation = 'none'; ov.firstElementChild.style.animation = 'none'; }
}

function render(){ reconcile(); renderPhone(); renderPanel(); }

// ---------- Ações ----------
function activate(famId, optId, hold){
  S.active[famId] = { opt: optId, status: 'processing' };
  if (!hold) timers.push(setTimeout(() => { const a = S.active[famId]; if (a && a.opt === optId){ a.status = 'active'; render(); } }, 2600));
}
function setInfActive(){ S.inf = 'active'; S.pk = null; S.seen.req = true; reconcile(); S.sheet = S.released ? {t:'transB'} : {t:'infOn'}; }

const PRESETS = {
  welcome(){ loadProfile(S.prof); S.screen = 'welcome'; },
  zero(){ loadProfile('p3'); },
  insuf(){ loadProfile('p2'); S.goal = null; S.screen = 'fam'; S.param = 'cofrinho'; S.sel = 'c110'; S.sheet = {t:'confirm', fam:'cofrinho', opt:'c110'}; },
  disp(){ loadProfile('p1'); S.screen = 'fam'; S.param = 'cofrinho'; S.sel = 'c115'; },
  proc(){ loadProfile('p1'); activate('cofrinho', 'c110', true); S.sheet = {t:'done', fam:'cofrinho'}; },
  ativo(){ loadProfile('p1'); S.active.cofrinho = {opt:'c110', status:'active'}; },
  troca(){ loadProfile('p1'); S.active.cofrinho = {opt:'c110', status:'active'}; S.screen = 'fam'; S.param = 'cofrinho'; S.sel = 'c115'; S.sheet = {t:'confirm', fam:'cofrinho', opt:'c115'}; },
  perda(){ loadProfile('p1'); S.active.cofrinho = {opt:'c115', status:'active'}; S.gasto = 4000; S.sheet = {t:'loss'}; },
  perdaCard(){ loadProfile('p2'); S.auc = 27000; S.sheet = {t:'lossCard'}; },
  infB(){ S.scen = 'B'; loadProfile('p1'); S.screen = 'shelf'; },
  transA(){ S.scen = 'A'; loadProfile('p1'); S.auc = P.corte; },
  transB(){ S.scen = 'B'; loadProfile('p1'); S.inf = 'active'; S.infVia = 'fichas'; S.seen.req = true; S.auc = P.corte; },
  legado(){ loadProfile('p1'); S.legacy = true; S.sheet = {t:'legacy'}; },
};

function act(a){
  const [cmd, x, y] = a.split(':');
  const go = (scr, param) => { S.screen = scr; S.param = param || null; S.sheet = null; };
  switch (cmd){
    case 'go': go(x); break;
    case 'home': go('home'); break;
    case 'back': go(S.screen === 'fam' ? 'shelf' : S.screen === 'pacote' ? 'home' : 'welcome'); break;
    case 'enter': go('home'); break;
    case 'openfam': go('fam', x); S.sel = y || (S.active[x] ? S.active[x].opt : null); break;
    case 'sel': S.sel = x; break;
    case 'sheet': S.cond = false; S.sheet = x === 'confirm' ? {t:x, fam:y, opt:a.split(':')[3]} : x === 'deact' ? {t:x, fam:y} : {t:x}; break;
    case 'beh': S.cond = false; S.sheet = {t:'beh', id:x}; break;
    case 'close': S.sheet = null; break;
    case 'tog': S.open[x] = !(S.open[x] ?? y === '1'); break;
    case 'do': activate(x, y); if (S.goal && S.goal.fam === x && S.goal.opt === y) S.goal = null; S.sheet = {t:'done', fam:x}; break;
    case 'undo': { const back = optOf(x, S.active[x].opt).price; delete S.active[x]; S.sel = null; S.sheet = {t:'done', fam:x, back}; break; }
    case 'goal': S.goal = {fam:x, opt:y}; go('home'); break;
    case 'simbeh': S.done[x] = true; break;
    case 'cond': S.cond = true; break;
    case 'noop': break;
    case 'infreq': S.inf = 'requested'; S.infVia = x; S.seen.req = true; S.sheet = {t:'infAsk'}; break;
    case 'approve': setInfActive(); break;
    case 'infoff': S.inf = 'none'; S.infVia = null; go('home'); break;
    case 'keepinf': S.infVia = 'fichas'; S.sheet = null; break;
    case 'seenrel': S.released = 0; S.sheet = null; if (x) go(x); break;
    case 'ibnotice': S.ibNotice = null; go('fam', 'investback'); S.sel = null; break;
    case 'finish': for (const k in S.active) S.active[k].status = 'active'; break;
    // painel
    case 'panel': document.getElementById('panel').classList.toggle('open'); return;
    case 'ptab': S.tab = x; break;
    case 'scen': S.scen = x; loadProfile(S.prof); break;
    case 'prof': loadProfile(x); break;
    case 'auc30': S.auc = Math.max(S.auc, P.corte); break;
    case 'leg': S.legRule = x; break;
    case 'preset': S.legacy = false; PRESETS[x](); document.getElementById('panel').classList.remove('open'); break;
  }
  render();
}

document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]'), el = e.target.closest('[data-a]');
  if (!el) return;
  if (stop && !stop.contains(el)) return;        // toque dentro da sheet não fecha
  if (el.classList.contains('ov') && stop) return;
  act(el.dataset.a);
});
document.addEventListener('input', e => {
  if (e.target.id === 'rAuc' || e.target.id === 'rGasto'){
    const k = e.target.id === 'rAuc' ? 'auc' : 'gasto'; S[k] = +e.target.value;
    document.getElementById(k === 'auc' ? 'oAuc' : 'oGasto').textContent = brl(S[k]);
    reconcile(); renderPhone();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.c){ S[t.dataset.c] = t.checked; render(); }
  else if (t.dataset.p){
    const [k, i] = t.dataset.p.split('.'), v = t.type === 'number' ? Math.max(0, +t.value || 0) : t.value.replace(/[<>]/g, '');
    if (i !== undefined) P[k][+i] = v; else P[k] = v;
    render();
  } else if (t.type === 'range') renderPanel();
});

loadProfile('p1');
S.screen = 'welcome';
render();
</script>
