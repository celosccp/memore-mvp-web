<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Loyalty XP Digital</title>
<style>
:root{
  --y:#FFC709; --y2:#FFE27A; --bk:#0B0B0C; --s1:#161618; --s2:#202024; --s3:#2C2C31;
  --tx:#F4F4F2; --mut:#A3A3A8; --dim:#6E6E75; --ok:#55D38A; --warn:#FF9F43; --line:#2A2A2F;
  --stage:#E9E8E4; --ink:#141414; --pmut:#62625E; --pline:#DAD9D4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
#stage{display:flex;height:100dvh}

/* ---------- Painel da demonstração ---------- */
#panel{width:clamp(270px,34vw,340px);flex:none;background:#fff;border-right:1px solid var(--pline);display:flex;flex-direction:column;z-index:30}
.ph{padding:16px 18px 10px;border-bottom:1px solid var(--pline)}
.ph h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
.ph p{margin:0;font-size:12px;color:var(--pmut)}
.ptabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--pline)}
.ptabs button{padding:9px 8px;font-size:13px;font-weight:600;color:var(--pmut);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--ink);border-color:var(--ink)}
.pbody{flex:1;overflow:auto;padding:14px 18px 28px;-webkit-overflow-scrolling:touch}
.pbody h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--pmut);margin:18px 0 8px;font-weight:700}
.pbody h2:first-child{margin-top:2px}
.seg{display:flex;background:#EFEEEA;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;color:var(--pmut)}
.seg button.on{background:var(--ink);color:#fff}
.hint{font-size:12px;color:var(--pmut);margin:6px 0 0}
.prof{display:block;width:100%;border:1px solid var(--pline);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.prof.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#FFFBE8}
.prof b{display:block;font-size:13px}
.prof span{font-size:12px;color:var(--pmut)}
.sl{margin-bottom:10px}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.sl output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.pbtn{display:block;width:100%;border:1px solid var(--pline);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:6px;background:#fff}
.pbtn.hot{background:var(--y);border-color:var(--ya)}
.pbtn small{display:block;font-weight:400;color:var(--pmut);font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 .pbtn{margin:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0}
.tog input{width:20px;height:20px;accent-color:var(--ink)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0}
.fld input{width:76px;padding:6px 8px;border:1px solid var(--pline);border-radius:8px;font:inherit;text-align:right}
.fld.txt{display:block}
.fld.txt input{width:100%;text-align:left;margin-top:3px}
.pbody ol,.pbody ul{margin:0;padding-left:18px;font-size:13px}
.pbody li{margin-bottom:8px}
.pbody li b{font-weight:650}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:#EFEEEA;color:var(--pmut);margin-right:4px;vertical-align:1px}
#panelToggle{display:none;position:fixed;left:12px;bottom:12px;z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* ---------- Telefone ---------- */
#phoneWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:8px}
#phone{width:390px;height:min(844px,calc(100dvh - 16px));background:var(--bk);color:var(--tx);border-radius:46px;border:9px solid #000;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{flex:none;height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:600}
.status i{font-style:normal;letter-spacing:1px;font-size:11px;color:var(--mut)}
#app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 10px;min-height:46px}
.hd h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
.hd .back{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:18px}
.scr{flex:1;overflow:auto;padding:2px 16px 22px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:#0E0E10;padding:6px 8px 16px}
.tabs button{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--dim);padding:5px 0}
.tabs button svg{display:block;margin:0 auto 3px}
.tabs button.on{color:var(--ya)}
h3.sec{font-size:13px;font-weight:700;color:var(--mut);margin:22px 0 9px;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline}
h3.sec button{color:var(--ya);font-size:13px;font-weight:600}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px}
.card + .card{margin-top:10px}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--s3);color:var(--tx);white-space:nowrap}
.chip.ok{background:rgba(85,211,138,.16);color:var(--oka)}
.chip.y{background:var(--y);color:#000}
.chip.warn{background:rgba(255,159,67,.16);color:var(--warn)}
.chip.ghost{background:transparent;border:1px solid var(--s3);color:var(--mut)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.saldo{background:var(--y);color:#000;border-radius:22px;padding:16px 16px 12px}
.saldo .lbl{font-size:13px;font-weight:600;opacity:.75}
.saldo .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.saldo .big small{font-size:16px;font-weight:700;letter-spacing:0;margin-left:4px}
.saldo .bar{height:8px;border-radius:6px;background:rgba(0,0,0,.16);margin:10px 0 9px;overflow:hidden;display:flex}
.saldo .bar i{background:#000;border-radius:6px}
.saldo .cols{display:flex;gap:18px;font-size:13px}
.saldo .cols b{font-size:17px;margin-right:4px}
.saldo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#000;margin-right:5px}
.saldo .dot.o{background:rgba(0,0,0,.2)}
.saldo .lnk{display:block;width:100%;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.14);font-size:13px;font-weight:700}
.strip{position:sticky;top:-2px;z-index:5;background:var(--bk);padding:4px 0 10px;margin-bottom:2px}
.strip>div{display:flex;background:var(--y);color:#000;border-radius:14px;padding:9px 14px;font-size:13px;gap:16px;align-items:center}
.strip b{font-size:17px;margin-right:3px}

.ban{display:flex;gap:10px;align-items:flex-start;width:100%;border-radius:16px;padding:12px 14px;margin-top:10px;background:var(--s2);border:1px solid var(--line);font-size:13.5px}
.ban .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--s3);font-size:13px}
.ban.warn{border-color:rgba(255,159,67,.5)} .ban.warn .ic{background:var(--warn);color:#000}
.ban.ok{border-color:rgba(85,211,138,.45)} .ban.ok .ic{background:var(--ok);color:#000}
.ban.y{border-color:var(--ya)} .ban.y .ic{background:var(--y);color:#000}
.ban b{display:block}
.ban span{color:var(--mut)}
.ban em{font-style:normal;color:var(--ya);font-weight:600;display:block;margin-top:3px}

.plast{width:74px;height:47px;border-radius:8px;flex:none;position:relative;overflow:hidden;font-size:9px;font-weight:800;letter-spacing:.06em;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between}
.plast.one{background:linear-gradient(135deg,#8C8C92,#4A4A50);color:#fff}
.plast.infinite{background:linear-gradient(135deg,#2A2A2E,#000);color:var(--ya);box-shadow:inset 0 0 0 1px #4a3f12}
.plast::after{content:"";width:13px;height:9px;border-radius:2px;background:rgba(255,255,255,.55);align-self:flex-start}
.plast.infinite::after{background:var(--y)}
.plast.lg{width:100%;height:150px;border-radius:16px;font-size:16px;padding:16px}
.plast.lg::after{width:30px;height:22px;border-radius:5px}
.row{display:flex;align-items:center;gap:12px}
.row .g{flex:1;min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--mut);flex:none;max-width:55%}
.kv span:last-child{text-align:right;font-weight:600}
.kv span:only-child{text-align:left;font-weight:400}
.kv.tot span{color:var(--tx);font-weight:800}
.prog{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.prog i{display:block;height:100%;background:var(--y);border-radius:4px}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:700;font-size:15px;background:var(--y);color:#000;margin-top:10px}
.btn.sec{background:var(--s3);color:var(--tx)}
.btn.ghost{background:transparent;color:var(--ya);padding:10px}
.btn.demo{background:transparent;border:1.5px dashed var(--dim);color:var(--mut);font-size:13px;padding:10px}
.btn[disabled]{opacity:.4}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:2px}
.li:last-child{padding-bottom:2px}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-size:14.5px;font-weight:650}
.li .g span{font-size:12.5px;color:var(--mut);display:block}
.li .chev{color:var(--dim);font-size:18px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--s3);display:grid;place-items:center;flex:none;color:var(--ya)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);margin-top:8px}
.opt.sel{border-color:var(--ya);background:#1d1a0c}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.opt.sel .rd{border-color:var(--ya)} .opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--y)}
.opt .g{flex:1} .opt .g b{display:block;font-size:15.5px} .opt .g span{font-size:12.5px;color:var(--mut)}
.foot{flex:none;border-top:1px solid var(--line);padding:10px 16px 14px;background:#0E0E10}
.foot .imp{font-size:13px;color:var(--mut);text-align:center}
.foot .imp b{color:var(--tx)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;font-size:13px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.cmp>div{padding:9px 10px;border-top:1px solid var(--line);background:var(--s1)}
.cmp>div:nth-child(-n+3){border-top:0;font-weight:700;background:var(--s2)}
.cmp>div:nth-child(3n+1){color:var(--mut)}
.cmp .cur{box-shadow:inset 2px 0 0 var(--y)}
.steps{display:flex;margin:14px 0 4px}
.steps div{flex:1;text-align:center;font-size:11.5px;color:var(--dim);position:relative;padding-top:20px;font-weight:600}
.steps div::before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--s3);z-index:1}
.steps div::after{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:var(--s3)}
.steps div:first-child::after{display:none}
.steps div.done{color:var(--tx)} .steps div.done::before,.steps div.done::after{background:var(--y)}
.steps div.now{color:var(--ya)} .steps div.now::before{background:var(--y);box-shadow:0 0 0 4px rgba(255,199,9,.25)} .steps div.now::after{background:var(--y)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 12px}
.swap>div{background:var(--s2);border-radius:14px;padding:11px 12px}
.swap>div.new{background:#1d1a0c;border:1.5px solid var(--y)}
.swap small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.swap b{font-size:15px;display:block;margin:2px 0}
.swap span{font-size:12px;color:var(--mut)}
.hero{background:#1d1a0c;border:1.5px solid var(--y);border-radius:16px;padding:14px;margin-bottom:12px}
.hero small{font-size:11px;color:var(--ya);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.hero b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.note{font-size:12.5px;color:var(--mut);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:10px}
.premissa{font-size:11.5px;color:var(--dim);margin-top:8px}
.premissa::before{content:"Premissa do protótipo · ";font-weight:700}

/* bottom sheet */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;animation:fd .18s}
.sheet{background:var(--s1);width:100%;max-height:90%;border-radius:26px 26px 0 0;padding:8px 18px 22px;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--s3);margin:2px auto 14px}
.sheet h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.sheet p{margin:0 0 12px;color:var(--mut);font-size:14px}
.sheet .card{background:var(--s2)}
@keyframes fd{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}
.okc{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#000;display:grid;place-items:center;font-size:28px;font-weight:800;margin:6px auto 12px}
.okc.wait{background:var(--s3);color:var(--ya)} .okc.wait .spin{width:24px;height:24px;border-width:3px}
.ctr{text-align:center}

@media (max-width:679px){
  #panel{position:fixed;inset:0 auto 0 0;max-width:88vw;transform:translateX(-102%);transition:transform .22s}
  #panel.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #panelToggle{display:block}
}
@media (max-width:480px){
  #phoneWrap{padding:0}
  #phone{width:100%;height:100dvh;border:0;border-radius:0}
  .status{display:none}
  #panelToggle{bottom:auto;top:8px;left:auto;right:10px;padding:6px 12px;opacity:.85}
}

/* ===== Tema inspirado nas telas de Design ===== */
:root{--ya:#FFC709;--oka:#7BE3A8;--ok:#7BE3A8;--s1:rgba(255,255,255,.065);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.13);--line:rgba(255,255,255,.09)}
#phone{background:radial-gradient(130% 48% at 22% 0%,#57401a 0%,#2a1e0e 34%,#0b0b0c 72%) #0b0b0c}
.hd{padding:8px 16px 12px;gap:12px}
.hd h1{font-size:16px;font-weight:650;letter-spacing:0}
.hd .back{width:38px;height:38px;background:rgba(255,255,255,.1);font-size:16px}
.card{border-radius:22px;border-color:rgba(255,255,255,.05)}
.btn{border-radius:999px}
.opt{background:rgba(255,255,255,.04);border-radius:18px}
.opt.sel{background:rgba(255,199,9,.1)}
.foot{background:#100e0b}
.sheet{background:#1b1815}
.hero,.swap>div.new{background:rgba(255,199,9,.1)}
.chip.av{background:var(--ok);color:#062b17}
.chip.use{background:rgba(255,199,9,.16);color:var(--ya)}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.d.y{background:var(--y)} .d.g{background:var(--ok)}
.bal{padding:4px 2px 0}
.bal .n{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.bal .n small{font-size:26px;font-weight:800}
.bal .bar{height:5px;border-radius:4px;background:rgba(255,255,255,.14);margin:10px 0 8px;display:flex;gap:3px;overflow:hidden}
.bal .bar i{border-radius:4px} .bal .bar .u{background:var(--y)} .bal .bar .a{background:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:20px;margin-top:12px}
.split>div{padding:12px 10px;text-align:center}
.split>div+div{border-left:1px solid rgba(255,255,255,.12)}
.split span{display:block;font-size:12.5px;color:var(--mut)}
.split b{font-size:18px;letter-spacing:-.01em}
.go{display:flex;justify-content:space-between;width:100%;padding:14px 6px 4px;font-weight:700;font-size:14.5px}
.ttabs{display:flex;position:sticky;top:-2px;z-index:6;margin:10px -16px 0;padding:0 16px;background:rgba(14,12,10,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ttabs button{flex:1;text-align:center;padding:13px 0 12px;font-weight:650;font-size:14.5px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.ttabs button.on{color:var(--tx);border-color:#fff}
.ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--y) calc(var(--p)*1%),rgba(255,255,255,.16) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#1d1914}
.ring>*{position:relative;font-size:12px;font-weight:700}
.plast.one{background:linear-gradient(135deg,#3a3a3e,#131314);color:#cfcfd2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.plast.infinite{background:linear-gradient(120deg,#b9b9bb,#77777a 55%,#9c9c9f);color:#111;box-shadow:none}
.plast.infinite::after{background:rgba(0,0,0,.45)}
.wel{flex:1;display:flex;flex-direction:column;padding:0 22px 22px;position:relative;overflow:auto;scrollbar-width:none}
.wel .art{position:absolute;inset:0 0 auto 0;width:100%;height:250px;-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.wel .hd,.wel .logo,.wel h2{position:relative}
.wel .logo{width:58px;height:50px;border-radius:9px;background:#fff;color:#111;font-weight:900;font-size:22px;letter-spacing:-.04em;display:grid;place-items:center;margin:14px auto 96px}
.wel h2{font-size:25px;line-height:1.18;letter-spacing:-.02em;margin:0}
.wel .num{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pks{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pks::-webkit-scrollbar{display:none}
.pk{flex:0 0 86%;scroll-snap-align:center;background:var(--s1);border:1.5px solid rgba(255,255,255,.06);border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.pk.cur{border-color:rgba(255,199,9,.6);background:rgba(255,199,9,.06)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)} .dots i.on{background:#fff;width:16px;border-radius:3px}
.pk.lock .plast{filter:grayscale(1) brightness(.6)}
.pk.lock .kv span:last-child{color:var(--mut)}
.chip svg{flex:none}

/* ===== Vidro fosco, acordeões e um momento de vitória ===== */
[hidden]{display:none!important}
#phone{background:radial-gradient(90% 38% at 105% 64%,rgba(150,104,30,.34),transparent 70%),radial-gradient(70% 30% at -10% 96%,rgba(120,84,28,.26),transparent 70%),radial-gradient(130% 48% at 22% 0%,#57401a 0%,#2a1e0e 34%,#0b0b0c 72%) #0b0b0c}
.card,.pk,.split,.ban,.opt{-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.ov{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet{background:rgba(36,30,23,.72);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);border-top:1px solid rgba(255,255,255,.16);box-shadow:0 -12px 44px rgba(0,0,0,.45)}
.sheet .card,.sheet .split{-webkit-backdrop-filter:none;backdrop-filter:none}
.foot{background:rgba(20,16,12,.66);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.ttabs{background:rgba(16,13,10,.6);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4)}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 4px 12px;margin-top:10px;font-weight:700;font-size:14px;border-top:1px solid var(--line)}
.acc span:last-child{font-size:18px}
.okc:not(.wait){animation:pop .55s cubic-bezier(.2,1.5,.4,1),halo 1.1s ease-out .1s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes halo{from{box-shadow:0 0 0 0 rgba(123,227,168,.55)}to{box-shadow:0 0 0 26px rgba(123,227,168,0)}}
@media (prefers-reduced-motion:reduce){.okc,.ov,.sheet{animation:none!important}}
.h2b{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;width:100%;display:flex;justify-content:space-between}
.glab{font-size:11.5px;color:var(--pmut);margin:8px 0 5px}
.pbody .grid2{margin-bottom:2px}

/* ===== Movimento ===== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.btn,.opt,.li,.go,.ttabs button{transition:transform .14s ease}
.btn:active,.opt:active,.go:active{transform:scale(.97)}
.btn:not(.sec):not(.ghost):not(.demo){box-shadow:0 10px 30px rgba(255,199,9,.24)}
.bal .bar i{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.scr.enter.sub>*,.scr.enter>.ttabs~*,.wel>*:not(.art){animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.scr.enter>*:nth-child(2),.wel>*:nth-child(3){animation-delay:.05s} .scr.enter>*:nth-child(3),.wel>*:nth-child(4){animation-delay:.1s}
.scr.enter>*:nth-child(4),.wel>*:nth-child(5){animation-delay:.15s} .scr.enter>*:nth-child(5),.wel>*:nth-child(6){animation-delay:.2s}
.scr.enter>*:nth-child(6),.wel>*:nth-child(7){animation-delay:.25s} .scr.enter>*:nth-child(7),.wel>*:nth-child(8){animation-delay:.3s}
.scr.enter>*:nth-child(n+8),.wel>*:nth-child(n+9){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.scr.enter .ring{animation:ringin 1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{--p:0}}
.plast::before{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(112deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);transform:translateX(-70%);animation:sheen 5s ease-in-out infinite;pointer-events:none}
.pk.lock .plast::before{display:none}
@keyframes sheen{0%,55%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.pk{transition:opacity .2s;transform-origin:center;will-change:transform}
.pk.cur{box-shadow:0 14px 40px rgba(255,199,9,.12),inset 0 1px 0 rgba(255,255,255,.1)}
.wel .art{animation:drift 10s ease-in-out infinite alternate;transform-origin:top}
@keyframes drift{to{transform:translateX(-14px) scaleY(1.08)}}
.wel .logo{animation:rise .6s both,glow 3.2s ease-in-out 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 44px rgba(255,199,9,.45)}}
.sheet{position:relative}
.cfs{position:absolute;left:50%;top:64px;pointer-events:none;z-index:2}
.cfs i{position:absolute;border-radius:50%;animation:cf 1s cubic-bezier(.12,.7,.3,1) both}
@keyframes cf{from{transform:none;opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:0}}
.chip.av{animation:avp 2.4s ease-in-out infinite}
@keyframes avp{50%{box-shadow:0 0 0 5px rgba(123,227,168,.14)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pks.solo .pk{flex-basis:100%}

/* ===== Medidor de XPoints ===== */
.gauge{position:relative;width:min(280px,82%);margin:2px auto 0}
.gauge svg{display:block;width:100%;overflow:visible}
.ga,.gu{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.gu{filter:drop-shadow(0 0 7px rgba(255,199,9,.55))} .ga{filter:drop-shadow(0 0 7px rgba(123,227,168,.5))}
.gd{transform-origin:150px 140px;transition:transform .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px #fff)}
.gc{position:absolute;left:0;right:0;top:36%;text-align:center}
.bal .gc .n{font-size:64px;line-height:1;letter-spacing:-.04em}
.split.s3{grid-template-columns:1fr 1fr 1fr;margin-top:2px}
.split.s3>*{padding:11px 4px;text-align:center}
.split.s3>*+*{border-left:1px solid rgba(255,255,255,.12)}
.split.s3 b{font-size:20px}
.d.o{background:rgba(255,255,255,.28)}
.okc.big{width:84px;height:84px;background:none;color:var(--ya)}
.okc.big .ring{width:84px;height:84px;--p:100}
.okc.big .ring::before{background:#241e17}
.okc.big svg{width:34px;height:34px}
.okc.big{margin-bottom:16px}
.up{font-style:normal;display:block;font-size:12px;font-weight:650;color:var(--ya);margin-top:1px}
.pk.lock .kv .up{color:var(--ya);opacity:.75}

/* ===== Saldo compacto em barra ===== */
.btop{display:flex;align-items:flex-end;gap:10px}
.bal .btop .n{font-size:46px;line-height:.95;letter-spacing:-.04em}
.blab{display:flex;flex-direction:column;padding-bottom:3px;line-height:1.2}
.blab b{font-size:17px} .blab span{font-size:12.5px;color:var(--mut)}
.hb{display:flex;gap:3px;height:10px;border-radius:6px;background:rgba(255,255,255,.1);margin:12px 0 10px;overflow:hidden}
.hb i{border-radius:6px;transition:width .8s cubic-bezier(.2,.8,.2,1);min-width:0}
.hb .bu{background:var(--y);box-shadow:0 0 12px rgba(255,199,9,.6)} .hb .ba{background:var(--ok);box-shadow:0 0 12px rgba(123,227,168,.55)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mut)}
.leg b{color:var(--tx);font-size:13.5px;margin-left:2px}
.leg button{color:var(--mut)}
.pk{padding:12px}
.pcs{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.pc{display:flex;flex-direction:column;min-width:0;text-align:left}
.pc+.pc{border-left:1px solid var(--line);padding-left:12px}
.pc .pl{font-size:11.5px;color:var(--mut)} .pc b{font-size:14px;line-height:1.3;white-space:nowrap;letter-spacing:-.01em} .pc .pcnd{font-size:11px;color:var(--mut)}
.pk.lock .pc b{color:var(--mut)}
.pkl{display:block;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;font-weight:650;color:var(--ya);text-align:left}
.mk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;font-style:normal}
.mk.on{background:var(--y);color:#000} .mk.off{border:1.5px solid var(--dim)} .mk.part{border:1.5px solid var(--y);color:var(--ya)}
.rv{font-size:13px;font-weight:700;color:var(--dim);white-space:nowrap} .rv.on{color:var(--ya)}
.st{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.stp{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;min-height:86px;padding:9px 9px 8px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.045);transition:transform .14s ease}
.stp:active{transform:scale(.97)}
.stp b{font-size:19px;letter-spacing:-.02em;line-height:1.1}
.stp .t{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .p{font-size:12px;margin-top:5px}
.stp .s{font-size:11px;font-weight:700;margin-top:2px;color:var(--oka)}
.stp.no b,.stp.no .p{color:var(--mut)} .stp.no .s{color:var(--dim)}
.stp.on{border-color:var(--ya);background:rgba(255,199,9,.12)} .stp.on .s{color:var(--ya)}
.stp.sel{border-color:var(--ya);box-shadow:0 0 0 3px rgba(255,199,9,.18)}
.pc .nil{color:var(--mut);font-weight:500}
.tb{align-self:flex-start;margin-top:auto;font-size:12px;font-weight:700;color:#000;background:var(--y);border-radius:999px;padding:4px 11px;transition:transform .14s ease}
.pc .up{margin-bottom:7px}
.tb:active{transform:scale(.95)}

/* ===== Central do cartão ===== */
h2.big{font-size:27px;letter-spacing:-.02em;margin:2px 0 16px;font-weight:650}
.card.hub{border-radius:26px;padding:16px}
.pillb{display:block;width:100%;text-align:center;margin-top:14px;padding:11px;border-radius:999px;background:var(--s3);font-weight:650;font-size:14.5px}
.ttabs.flat{position:static;margin:18px -16px 0;gap:22px;overflow-x:auto;scrollbar-width:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ttabs.flat button{flex:none;font-size:17px;padding:10px 0 12px}
h3.sec2{font-size:19px;font-weight:500;margin:26px 0 12px;letter-spacing:-.01em}
h3.sec2 span{display:block;font-size:14.5px;color:var(--mut);font-weight:400;margin-top:2px}
.sels{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-left:16px}
.sel{flex:0 0 44%;height:200px;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;scroll-snap-align:start}
.sel b{font-size:17px} .sel span{font-size:12.5px;opacity:.82;line-height:1.3;margin-top:3px}
.dest{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.dest .sel{grid-row:1/3;height:auto;min-height:250px}
.dest .card{margin:0;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.dest .card .lg{width:30px;height:30px;border-radius:50%;margin-bottom:auto}

/* ===== Tema claro ===== */
#phone.light{--bk:#FAFAFB;--tx:#16161A;--mut:#6A6A72;--dim:#A3A3AB;--s1:#EFEFF3;--s2:#E9E9EE;--s3:#DFDFE5;--line:rgba(0,0,0,.09);--ya:#16161A;--oka:#0A7A3D;--ok:#14A558;
  background:radial-gradient(120% 34% at 18% 0%,#FFF1BF 0%,rgba(255,241,191,0) 62%) #FAFAFB;color:var(--tx)}
.light .status i{color:#55555c}
.light .hd .back{background:#ECECEF}
.light .card,.light .pk,.light .split,.light .ban,.light .opt,.light .stp{background:#EFEFF3;border-color:rgba(0,0,0,.04);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.light .pk.cur{border-color:#E2B100;background:#FFF8DB;box-shadow:0 12px 30px rgba(226,177,0,.16)}
.light .opt.sel,.light .stp.on,.light .hero,.light .swap>div.new{background:#FFF5CC;border-color:#E2B100}
.light .stp.sel{border-color:#E2B100;box-shadow:0 0 0 3px rgba(226,177,0,.22)}
.light .ban.warn{border-color:rgba(255,159,67,.7)} .light .ban.ok{border-color:rgba(12,127,69,.4)} .light .ban.y{border-color:#E2B100}
.light .ttabs{background:rgba(250,250,251,.86)} .light .ttabs button.on{border-color:#16161A}
.light .foot{background:rgba(250,250,251,.92)}
.light .ov{background:rgba(20,20,26,.3)}
.light .sheet{background:rgba(255,255,255,.88);border-top-color:rgba(0,0,0,.05);box-shadow:0 -12px 44px rgba(0,0,0,.16)}
.light .sheet .card,.light .sheet .split,.light .swap>div,.light .note{background:#F0F0F4}
.light .hb,.light .prog{background:#E2E2E8}
.light .ring{background:conic-gradient(#E2B100 calc(var(--p)*1%),#D9D9E0 0)}
.light .ring::before{background:#EFEFF3} .light .sheet .ring::before{background:#F0F0F4} .light .okc.big .ring::before{background:#fff}
.light .dots i{background:#CDCDD5} .light .dots i.on{background:#16161A}
.light .d.o{background:#C2C2CB}
.light .chip{background:#E1E1E7;color:#16161A}
.light .chip.y{background:var(--y);color:#000} .light .chip.av{background:#14A558;color:#fff}
.light .chip.use{background:#FFE27A;color:#16161A} .light .chip.ok{background:#DDF3E6;color:#0A7A3D}
.light .chip.ghost{background:transparent;border-color:#CDCDD5;color:#6A6A72}
.light .ico{background:#E1E1E7;color:#16161A}
.light .okc.wait{background:#E9E9EE} .light .okc.big{background:none}
.light .mk.off{border-color:#B9B9C2}
.light .btn.sec{background:#E1E1E7;color:#16161A}
.light .cmp>div{background:#F4F4F7} .light .cmp>div:nth-child(-n+3){background:#E9E9EE}
.light .steps div::before,.light .steps div::after{background:#D6D6DD}
.light .steps div.done::before,.light .steps div.done::after,.light .steps div.now::before,.light .steps div.now::after{background:#E2B100}
.light .wel .logo{background:#16161A;color:#fff} .light .wel .num{background:#E9E9EE}
.light .pk.lock .plast{filter:grayscale(1) opacity(.55)}
.light .gd,.light .hb .bu,.light .hb .ba{box-shadow:none}
.light .btn:not(.sec):not(.ghost):not(.demo){box-shadow:0 10px 26px rgba(226,177,0,.28)}

/* ===== Réguas ===== */
:root{--nb:#1e1b17} #phone.light{--nb:#EFEFF3}
.rs{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.rh b{font-size:15px} .rh>span{font-size:12px;color:var(--ya);font-weight:650;white-space:nowrap}
.rg{position:relative}
.rt{position:absolute;left:calc(50%/var(--n));right:calc(50%/var(--n));top:8px;height:4px;border-radius:2px;background:var(--s3)}
.rt i{display:block;height:100%;background:var(--y);border-radius:2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rn{display:grid;grid-template-columns:repeat(var(--n),1fr);position:relative}
.nd{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;transition:transform .14s ease}
.nd:active{transform:scale(.94)}
.nd i{width:20px;height:20px;border-radius:50%;box-sizing:border-box;background:var(--nb);border:3px solid var(--dim);margin-bottom:7px}
.nd b{font-size:13px;line-height:1.2;font-weight:650} .nd span{font-size:10.5px;color:var(--mut)}
.nd.org i{width:12px;height:12px;margin:4px 0 11px;border:0;background:var(--dim)}
.nd.org b{color:var(--mut);font-weight:500}
.nd.past i{background:var(--y);border-color:var(--y)}
.nd.cur i{background:var(--y);border-color:var(--y);box-shadow:0 0 0 5px rgba(255,199,9,.28)}
.nd.av i{border-color:var(--ok)}
.nd.no b,.nd.no span{color:var(--dim)}
.nd.proc i{animation:ndp 1s ease-in-out infinite} @keyframes ndp{50%{box-shadow:0 0 0 9px rgba(255,199,9,.1)}}
.lk{display:block;width:100%;margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
[data-a]{cursor:pointer}
.light .okc:not(.wait):not(.big){color:#fff}
.light .rh>span::before,.light .up::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--y);margin-right:6px;vertical-align:1px}
.light .nd i{background:#fff;border-color:#B4B4BD}
.light .nd.av i{border-color:#14A558;background:#fff}
.light .nd.past i,.light .nd.cur i{background:var(--y);border-color:var(--y)}
.light .nd.cur i{box-shadow:0 0 0 5px rgba(255,199,9,.35)}
.light .nd.org i{background:#B4B4BD}
.light .nd.no b,.light .nd.no span{color:#A3A3AB}
.light .hb .ba{background:#14A558}
.light .ban em,.light h3.sec button,.light .btn.ghost,.light .pkl{color:#16161A;text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:3px}
.light .card,.light .pk,.light .split,.light .ban,.light .opt,.light .stp{background:#F1F1F4}
#phone.light{background:radial-gradient(120% 30% at 18% 0%,#FFF6D6 0%,rgba(255,246,214,0) 60%) #FCFCFD}
.pk2{flex:0 0 88%;scroll-snap-align:center;background:var(--s1);border:1.5px solid rgba(255,255,255,.06);border-radius:22px;padding:14px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:opacity .2s;will-change:transform}
.pks.solo .pk2{flex-basis:100%}
.pks{align-items:flex-start}
.pk2.lock .plast{filter:grayscale(1) brightness(.6)}
.light .pk2{background:#F1F1F4;border-color:rgba(0,0,0,.04);-webkit-backdrop-filter:none;backdrop-filter:none}
.light .pk2.lock .plast{filter:grayscale(1) opacity(.55)}
.rr{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.rr>b{font-size:15px;flex:1}
.rv2{font-size:12.5px;color:var(--mut);text-align:right} .rv2 b{color:var(--tx);font-weight:650}
.pm{font-size:18px;width:14px;text-align:center}
.nd.cur span{color:var(--tx);font-weight:700}
.nd.av span{color:var(--oka);font-weight:600}
.rg.off .nd i{border-color:var(--s3)}

/* ===== Hub compacto: a aba Usar cabe sem rolar ===== */
.hd{padding:2px 16px 6px;min-height:42px}
.hd .back{width:34px;height:34px}
.status{height:34px}
.hubv .bal .btop .n{font-size:36px}
.hubv .blab b{font-size:15px} .hubv .blab span{font-size:12px}
.hubv .hb{height:8px;margin:8px 0 7px}
.hubv .leg{font-size:12px;gap:2px 12px} .hubv .leg b{font-size:13px}
.hubv .ttabs{margin-top:8px} .hubv .ttabs button{padding:9px 0 8px;font-size:14px}
.s-shelf .pks{margin-top:10px!important}
.s-shelf .pk2{padding:11px 13px}
.s-shelf .pk2 .plast{width:62px;height:40px}
.s-shelf .rs{margin-top:9px;padding-top:9px}
.s-shelf .dots{margin:7px 0 9px}
.s-shelf .card{padding:10px 13px 9px;border-radius:20px}
.s-shelf .card+.card{margin-top:8px}
.s-shelf .rh{margin-bottom:8px}
.s-shelf .rh .ico{width:28px!important;height:28px!important}
.s-shelf .nd i{width:18px;height:18px;margin-bottom:4px}
.s-shelf .rt{top:7px}
.s-shelf .nd.org i{width:10px;height:10px;margin:4px 0 8px}
.s-shelf .nd b{font-size:12.5px}
.s-shelf.scr{padding-bottom:10px}
.stack{margin-top:10px}
.peek{display:flex;align-items:center;gap:7px;width:calc(100% - 30px);margin:0 15px -18px;padding:8px 14px 26px;border-radius:18px 18px 0 0;background:rgba(255,255,255,.1);font-size:12.5px;color:var(--mut);text-align:left;transition:transform .14s ease}
.peek:active{transform:translateY(-3px)}
.peek b{color:var(--tx);font-size:13.5px;flex:1}
.light .peek{background:#E3E3E9}
.stack .pk2{position:relative;z-index:1;background:var(--nb);box-shadow:0 -6px 18px rgba(0,0,0,.22);animation:pkin .32s cubic-bezier(.2,.8,.2,1)}
.light .stack .pk2{background:#F1F1F4;box-shadow:0 -5px 14px rgba(0,0,0,.07)}
@keyframes pkin{from{transform:translateY(10px);opacity:.6}}
.s-shelf .stack+.card{margin-top:8px}

/* pontos disponíveis: contorno amarelo (uma cor só para "dá para ativar"); cinza para o que ainda não cabe */
.nd.av i,.light .nd.av i{border-color:var(--y)}
.nd.av span{color:var(--mut);font-weight:600}
.light .nd.av span{color:#3A3A42}
.s-shelf .rs{margin-top:8px;padding-top:8px}
.s-shelf .rs .rh{margin-bottom:7px} .s-shelf .rh b{font-size:14px}
/* cartão de trás: a ponta do plástico aparecendo, com o progresso na borda */
.peek{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;width:calc(100% - 44px);margin:0 22px -20px;padding:9px 14px 28px;border-radius:14px 14px 0 0;font-size:12px;text-align:left;box-shadow:0 -2px 10px rgba(0,0,0,.18)}
.peek b{flex:none;font-size:10.5px;letter-spacing:.09em;font-weight:800;color:inherit}

/* ===== Regras de animação =====
   1 entradas a partir de scale .97   2 toque com scale .97 em 150 ms   3 tremor no bloqueado
   4 abas entram da direção do movimento   5 acordeões animam a altura   6 mover com transform
   7 troca de tema sem transição   9 e 10 painel arrastável com resistência */
:root{interpolate-size:allow-keywords}
@keyframes rise{from{opacity:0;transform:scale(.97)}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@keyframes wdot{from{background:var(--s3);transform:scale(.9);opacity:0}}
@keyframes up{from{transform:translateY(22px) scale(.97);opacity:0}}
@keyframes pkin{from{transform:scale(.97);opacity:0}}
button,[role=button],.tb,.pkl2{transition:scale 150ms ease-out}
button:active,[role=button]:active,.tb:active{scale:.97}
.btn:active,.opt:active,.go:active,.nd:active,.stp:active,.tb:active{transform:none}
.ov:active,.pk2[role=button]:active{scale:1}
@keyframes shake{0%{transform:translateX(0)}17%{transform:translateX(-10px)}33%{transform:translateX(10px)}50%{transform:translateX(-6px)}67%{transform:translateX(6px)}83%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.chip.shake{animation:shake 360ms ease-in-out;border-color:#E5484D!important;color:#E5484D!important}
.scr.enter.from-r>.ttabs~*,.scr.enter.from-l>.ttabs~*{animation-duration:.3s;animation-delay:0s!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.scr.enter.from-r>.ttabs~*{animation-name:slideR} .scr.enter.from-l>.ttabs~*{animation-name:slideL}
@keyframes slideR{from{opacity:0;transform:translateX(34px)}} @keyframes slideL{from{opacity:0;transform:translateX(-34px)}}
.acc-in{overflow:hidden;animation:accin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes accin{from{height:0;opacity:0}to{height:auto;opacity:1}}
.hb{display:block;position:relative}
.hb i{position:absolute;inset:0;border-radius:0;transform-origin:0 50%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.rt i{width:100%;transform-origin:0 50%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.theme-switching,.theme-switching *{transition:none!important}
.sheet::before{display:none}
.grab{display:block;height:30px;margin:-8px -18px 0;touch-action:none;cursor:grab;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:10px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--s3)}
.sheet{will-change:transform}
@media (prefers-reduced-motion:reduce){.chip.shake,.acc-in{animation:none!important}}

#cmp{background:#F1F1F1;color:#1A1A1A;border-left:1px solid #DCDCDC;font-family:'Roboto',system-ui,Arial,sans-serif}

function cmpEntries(mode){
  const ai = Math.min(Math.round(S.auc / CMP.aucStep), CMP.n.length / CMP.nTpv - 1), ti = Math.min(Math.round(S.gasto / CMP.tpvStep), CMP.nTpv - 1), k = ai * CMP.nTpv + ti;
  const over = mode === 'fin' ? Object.fromEntries(CMP.f[k].map(e => [e[0], e.slice(1)])) : {};
  return { tpv: ti * CMP.tpvStep, list: CMP.inst.map((banco, i) => { const e = over[i] || CMP.n[k][i]; if (!e) return null;
    const [pi, cash, kind, yld, cdi, serv0, cost] = e, serv = mode === 'fin' ? 0 : serv0;
    return { banco, nome: CMP.prod[pi], cash, kind, yld, cdi, serv, cost, bruto: cash + yld + serv, v: cash + yld + serv - cost }; }).filter(Boolean) };
}
// Valor da Jornada XP como está simulada no app, nas mesmas premissas do comparador:
// CDI de 14,9% ao ano, 22,5% de imposto sobre o rendimento, sala VIP a US$ 50 por acesso com dólar a R$ 5,50; corretagem a R$ 3,50 por ordem (planilha do simulador).
const CMPX = { cdi: 14.9, tax: 22.5, usd: 5.5, loungeUsd: 50, ordem: 3.5, saldoMax: 10000 };
function jornadaEntry(mode){
  const card = activeCard(), on = f => S.active[f] && S.active[f].status === 'active' ? S.active[f].opt : null;
  const ib = investbackNow(), cof = on('cofrinho'), taxa = cof ? +cof.slice(1) : P.cofBase, cz = on('corretagem'), ordens = cz ? +cz.slice(2) : 0, acessos = salaNow(card, true).n;
  const mes = Math.pow(1 + CMPX.cdi / 100, 1 / 12) - 1;
  const yld = Math.round(Math.min(S.auc, CMPX.saldoMax) * mes * Math.max(0, taxa - 100) / 100 * (1 - CMPX.tax / 100));
  const cash = Math.round(ib.valor), serv = mode === 'fin' ? 0 : Math.round(ordens * CMPX.ordem + acessos * CMPX.loungeUsd * CMPX.usd / 12);
  const partes = [ordens ? `${ordens} ordens sem corretagem` : '', acessos ? `${acessos} acessos a salas VIP` : ''].filter(Boolean).join(' e ');
  return { banco: 'XP', nome: `${card === 'infinite' ? 'XP Infinite' : 'XP One'} · como está no app`, cash, kind: 1, yld, cdi: taxa > 100 ? taxa : 0, serv, cost: 0, bruto: cash + yld + serv, v: cash + yld + serv,
    tpv: S.gasto, lab: { cash: 'Investback', yld: 'Cofre XP', serv: partes ? partes.charAt(0).toUpperCase() + partes.slice(1) : 'Serviços' }, vazio: 'Nenhum benefício ativo. Ative no app para ver o valor subir.' };
}
function renderCmp(){
  const el = document.getElementById('cmp'); if (!el) return;
  const mode = S.cmpMode || 'all', off = S.cmpOff || (S.cmpOff = {}), { tpv, list } = cmpEntries(mode);
  const xp = list.find(r => r.banco === 'XP'), bancos = CMP.inst.filter(b => b !== 'XP'), ligados = bancos.filter(b => !off[b]);
  const riv = list.filter(r => r.banco !== 'XP' && !off[r.banco]).sort((x, y) => y.v - x.v).slice(0, 10), jx = jornadaEntry(mode);
  const top = Math.max(1, jx.bruto, xp ? xp.bruto : 0, ...riv.map(r => r.bruto));
  const pct = (v, base = tpv) => base ? ' ' + (v / base * 100).toFixed(1).replace('.', ',').replace(',0', '') + '%' : '';
  const row = (r, rk, cls = '') => `<div class="cr ${cls}"><div class="rk">${rk}</div>${CMPLOGO[r.banco] ? `<img class="lgo" src="${CMPLOGO[r.banco]}" alt="">` : '<i class="lgo"></i>'}<div style="min-width:0"><b>${r.banco}</b><span>${r.nome}</span></div><div class="v">${brl(r.v)}<small>/mês</small></div>
      <div class="sb" style="width:${Math.max(4, r.bruto / top * 100)}%">${r.cash > 0 ? `<i class="k1" style="flex:${r.cash}"></i>` : ''}${r.yld > 0 ? `<i class="k2" style="flex:${r.yld}"></i>` : ''}${r.serv > 0 ? `<i class="k3" style="flex:${r.serv}"></i>` : ''}</div>
      <div class="tg">${r.cash > 0 ? `<em class="k1">${r.lab ? r.lab.cash : r.kind === 2 ? 'Pontos' : r.kind === 1 ? 'Cashback' : 'Conta'}${r.kind ? pct(r.cash, r.tpv) : ''} · ${brl(r.cash)}</em>` : ''}${r.yld > 0 ? `<em class="k2">${r.lab ? r.lab.yld : 'Caixinha'}${r.cdi ? ' ' + r.cdi + '% CDI' : ''} · ${brl(r.yld)}</em>` : ''}${r.serv > 0 ? `<em class="k3">${r.lab ? r.lab.serv : 'Serviços'} · ${brl(r.serv)}</em>` : ''}${r.cost > 0 ? `<em class="k4">Mensalidade · − ${brl(r.cost)}</em>` : ''}${r.bruto <= 0 && r.cost <= 0 ? `<em style="white-space:normal;line-height:1.35;border-radius:10px">${r.vazio || 'Sem valor estimado neste perfil'}</em>` : ''}</div></div>`;
  const melhor = riv[0], dif = melhor ? melhor.v - jx.v : 0, pos = riv.filter(r => r.v > jx.v).length + 1, ganho = xp ? jx.v - xp.v : jx.v, aberto = isOpen('cmpf');
  el.innerHTML = `<div class="ch"><button class="cx" data-a="cmpopen">Minimizar ›</button><h1>Nos outros bancos</h1><p>Quanto este cliente teria por mês com <b>${brl(S.auc)}</b> investidos e <b>${brl(S.gasto)}</b> no cartão.</p></div>
    <div class="cb"><div class="seg"><button class="${mode === 'all' ? 'on' : ''}" data-a="cmp:all">Tudo</button><button class="${mode === 'fin' ? 'on' : ''}" data-a="cmp:fin">Só financeiro</button></div>
    <div class="lg"><span><i class="k1"></i>Cashback ou pontos</span><span><i class="k2"></i>Caixinha (% do CDI)</span>${mode === 'all' ? '<span><i class="k3"></i>Serviços</span>' : ''}</div>
    <div class="gl">Jornada XP · simulação no app</div>
    ${row(jx, '', 'xp')}
    <div class="gl">XP hoje</div>
    ${xp ? row({ ...xp, nome: xp.nome + ' · sem a Jornada XP' }, '', 'xp ref') : `<div class="cr xp ref"><div class="rk"></div>${CMPLOGO.XP ? `<img class="lgo" src="${CMPLOGO.XP}" alt="">` : '<i class="lgo"></i>'}<div style="min-width:0"><b>Sem cartão elegível</b><span>Abaixo do mínimo de investimento</span></div><div class="v">${brl(0)}<small>/mês</small></div></div>`}
    <div class="gl" style="display:flex;justify-content:space-between;align-items:center">Top ${riv.length || 10} fora da XP <button class="fb" data-a="tog:cmpf:0">Bancos ${ligados.length}/${bancos.length} ${aberto ? '−' : '+'}</button></div>
    ${aberto ? `<div class="fbx"><div class="fba"><button data-a="cmpbank:*">Todos</button><button data-a="cmpbank:-">Limpar</button></div>${bancos.map(b => `<button class="chb ${off[b] ? '' : 'on'}" data-a="cmpbank:${b}">${b}</button>`).join('')}</div>` : ''}
    ${riv.length ? riv.map((r, i) => row(r, (i + 1) + 'º')).join('') : '<div class="gap">Nenhum banco selecionado. Abra o filtro e escolha pelo menos um.</div>'}
    ${melhor ? `<div class="gap">${dif > 0 ? `Com a Jornada XP como está no app, a XP ficaria em <b>${pos}º</b> entre ${riv.length + 1}. A melhor oferta ${ligados.length < bancos.length ? 'entre os bancos escolhidos' : 'de fora'} entrega <b>${brl(dif)}</b> a mais por mês.` : `Com a Jornada XP como está no app, a XP entrega mais que ${ligados.length < bancos.length ? 'os bancos escolhidos' : 'todas as ofertas de fora'}.`}${xp ? ` Em relação à regra de hoje, ${ganho > 0 ? `são <b>${brl(ganho)}</b> a mais` : ganho < 0 ? `são <b>${brl(-ganho)}</b> a menos` : 'o valor é o mesmo'}.` : ''}</div>` : ''}
    <p class="src">${mode === 'all' ? 'Valor líquido por mês: dinheiro de volta, rendimento acima de 100% do CDI e serviços pelo preço equivalente, menos a mensalidade.' : 'Só dinheiro de volta, pontos e rendimento acima de 100% do CDI, menos a mensalidade. Não conta serviços como salas VIP e assinaturas.'} A melhor modalidade de cada instituição. Caixinha: rendimento extra sobre até R$ 10 mil. O percentual ao lado de cashback ou pontos é o retorno efetivo sobre o gasto. A linha da Jornada XP soma o que está ativo no app, nas mesmas premissas: CDI de 14,9% ao ano com 22,5% de imposto, sala VIP a US$ 50 por acesso e corretagem a R$ 3,50 por ordem. XP One com Investback de 0,8% a partir de R$ 2.500 de gasto e 1% a partir de R$ 5.000. Pontos valem R$ 30 o milheiro. Fonte: Comparativo econômico das propostas de valor, pesquisa de ${CMP.date.split('-').reverse().join('/')}. Valores da faixa mais próxima (patrimônio de R$ 5 mil em R$ 5 mil, gasto de R$ 500 em R$ 500).</p></div>`;
}

const EARN = {

const brl = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const pt  = n => n + (Math.abs(n) === 1 ? ' XPoint' : ' XPoints');
const cardName = c => c === 'infinite' ? 'Cartão XP Infinite' : 'Cartão XP One';
const activeCard = () => S.inf === 'active' ? 'infinite' : 'one';
const elig = () => S.auc >= P.corte;

const ptsCartao = () => Math.min(Math.floor(S.gasto / P.cartaoPor), P.cartaoMax);
const ptsAuc    = () => Math.min(Math.floor(S.auc / P.aucBloco), P.aucMax);
// três mecânicas: "tem ou não tem" (pts), "a cada valor" (step/max) e "por faixas" (fx)
const isBlk  = b => !!(b.dyn || b.step);
const stepOf = b => b.id === 'cartao' ? P.cartaoPor : b.id === 'auc' ? P.aucBloco : b.step;
const valOf  = b => b.id === 'cartao' ? S.gasto : b.id === 'auc' ? S.auc : (S.val[b.id] || 0);
const faixa  = v => P.salFaixas.reduce((r, [piso, pts]) => v > piso ? pts : r, 0);
const behMax = b => b.id === 'cartao' ? P.cartaoMax : b.id === 'auc' ? P.aucMax : b.step ? b.max : b.fx ? Math.max(...P.salFaixas.map(f => f[1])) : b.pts;
function behPts(b){ return isBlk(b) ? Math.min(Math.floor(valOf(b) / stepOf(b)), behMax(b)) : b.fx ? faixa(valOf(b)) : (S.done[b.id] ? b.pts : 0); }
const gainOf = b => isBlk(b) ? 1 : b.fx ? P.salFaixas.find(f => f[1] > 0)[1] : b.pts;   // quanto rende o próximo movimento
const visibleBeh = () => BEH.filter(b => !b.off && (!b.optional || S.segcc) && (!b.soon || S.pfm));
const total = () => visibleBeh().reduce((s,b) => s + behPts(b), 0);

const IB = { one: () => [ {id:'o10', label:'1,0% de Investback', rate:1.0, price:P.ibOne[0]} ],
             infinite: () => [ {id:'i12', label:'1,2% de Investback', rate:1.2, price:P.ibInf[0]}, {id:'i15', label:'1,5% de Investback', rate:1.5, price:P.ibInf[1]} ] };
// Sala VIP: incluída no Infinite (mínimo de largada) ou só por XPoints. O número da opção é o total de acessos por ano.
const salaBase = card => card === 'infinite' && S.salaMode === 'incluida' ? P.salaIncl : 0;
const SVALL = { one: [['sv_o2', 2, 30], ['sv_o4', 4, 45]], infinite_incluida: [['sv_i6', 6, 60]], infinite_fichas: [['sv_f2', 2, 30], ['sv_f4', 4, 45]] };
const svOpts = key => SVALL[key].map(([id, n, price]) => ({ id, n, price, label: `${n} acessos por ano` }));
const SV = card => svOpts(card === 'one' ? 'one' : 'infinite_' + S.salaMode);
function salaNow(card, mine){
  const a = mine && S.active.salavip, base = salaBase(card), opts = SV(card), max = opts[opts.length - 1].n;
  const n = a && a.status === 'active' ? optOf('salavip', a.opt).n : base;
  return { n, base, max, main: n ? `${n} acessos por ano` : `Até ${max} acessos por ano`, up: n >= max ? '' : n ? `até ${max} com XPoints` : 'com XPoints' };
}
function families(card = activeCard()){
  return [
    { id:'cofrinho', nome:'Cofre XP Turbo', desc:'O dinheiro guardado no Cofre XP rende mais.',
      opts:[ {id:'c110', label:'110% do CDI', price:P.cofre[0]}, {id:'c115', label:'115% do CDI', price:P.cofre[1]}, {id:'c125', label:'125% do CDI', price:P.cofre[2]} ] },
    { id:'investback', nome:'Investback turbinado', desc:'Mais dinheiro de volta nas compras.', card, opts: IB[card]() },
    { id:'corretagem', nome:'Corretagem zero', desc:'Invista na bolsa sem pagar corretagem.',
      opts:[3, 6, 10].map((n, i) => ({ id:'cz' + n, n, label:`${n} ordens por mês`, price:P.corr[i] })) },
    { id:'salavip', nome:'Sala VIP', desc: salaBase(card) ? `Mais acessos a salas VIP, além dos ${salaBase(card)} do seu cartão.` : 'Acessos a salas VIP em aeroportos.', card, opts: SV(card) },
  ];
}
const fam = id => families().find(f => f.id === id);
function optOf(famId, optId){
  const pool = famId === 'investback' ? [...IB.one(), ...IB.infinite()] : famId === 'salavip' ? Object.keys(SVALL).flatMap(svOpts) : fam(famId).opts;
  return pool.find(o => o.id === optId);
}
const infByPoints = () => S.inf !== 'none' && S.infVia === 'fichas';
function allocated(){
  let a = infByPoints() ? P.infPts : 0;
  for (const f in S.active) a += optOf(f, S.active[f].opt).price;
  return a;
}
const available = () => Math.max(0, total() - allocated());
const deficit   = () => Math.max(0, allocated() - total());
const cardAtRisk = () => S.inf === 'active' && S.infVia === 'patrimonio' && !elig();
// XPoints que faltam para escolher uma opção (considera a liberação da opção atual da mesma família)
function missing(famId, optId){
  const cur = S.active[famId];
  const back = cur ? optOf(famId, cur.opt).price : 0;
  return Math.max(0, optOf(famId, optId).price - (total() - allocated()) - back);
}
const baseRate = c => c === 'infinite' ? 1.0 : 0;   // no One, o Investback vem só de XPoints
function investbackNow(){
  const c = activeCard(), a = S.active.investback;
  const rate = a && a.status === 'active' ? optOf('investback', a.opt).rate : baseRate(c);
  const applies = rate > 0;
  return { rate, applies, valor: applies ? S.gasto * rate / 100 : 0 };
}
const pct = r => r.toFixed(1).replace('.', ',') + '%';

// mantém o estado coerente depois de qualquer mudança
function reconcile(){
  if (S.inf !== 'none' && S.infVia === 'fichas' && S.scen === 'A'){ S.inf = 'none'; S.infVia = null; }
  const svOk = id => SV(activeCard()).some(o => o.id === id);
  if (S.active.salavip && !svOk(S.active.salavip.opt)){ S.ibNotice = { label:'Sala VIP com XPoints', price:optOf('salavip', S.active.salavip.opt).price, sv:true }; delete S.active.salavip; }
  if (S.goal && S.goal.fam === 'salavip' && !svOk(S.goal.opt)) S.goal = null;
  if (S.screen === 'fam' && !fam(S.param)){ S.screen = 'shelf'; S.param = null; }
  if (S.sheet && S.sheet.fam && !fam(S.sheet.fam)) S.sheet = null;
  setTimeout(trailCheck, 0);
  if (S.scen === 'A' && S.infVia === 'fichas'){ S.inf = 'none'; S.infVia = null; }
  if (infByPoints() && elig()){           // transição no corte patrimonial (cenário B)
    S.infVia = 'patrimonio'; S.released = P.infPts; S.sheet = {t:'transB'}; S.fx = true;
  }
  const a = S.active.investback;          // Investback turbinado pertence a um cartão
  if (a && !IB[activeCard()]().some(o => o.id === a.opt)){
    const o = optOf('investback', a.opt);
    S.ibNotice = { label:o.label, price:o.price }; delete S.active.investback;
  }
  if (S.goal && S.goal.fam === 'investback' && !IB[activeCard()]().some(o => o.id === S.goal.opt)) S.goal = null;
}

// celebra quando a trilha que o cliente segue fica completa
function trailCheck(){
  const met = !!S.goal && !!fam(S.goal.fam) && missing(S.goal.fam, S.goal.opt) === 0;
  const fire = met && !S.goalWas && S.screen !== 'welcome';
  S.goalWas = met;
  if (fire){ S.sheet = {t:'trailDone'}; S.fx = true; renderPhone(); }
}
// sugestões de próxima ação, na ordem pensada para o perfil
function suggestions(n = 3){
  const out = [];
  for (const id of PROFILES[S.prof].rec){
    const b = beh(id);
    if (id === 'cartao'){
      if (ptsCartao() >= P.cartaoMax) continue;
      const falta = P.cartaoPor - (S.gasto % P.cartaoPor);
      out.push({ id, gain:1, t:'Concentrar compras no cartão', d:`Mais ${brl(falta)} no mês valem 1 XPoint. Use o cartão no que você já compra.` });
    } else if (id === 'auc'){
      if (ptsAuc() >= P.aucMax) continue;
      const falta = P.aucBloco - (S.auc % P.aucBloco);
      out.push({ id, gain:1, t:'Investir um pouco mais', d:`Faltam ${brl(falta)} investidos para ganhar 1 XPoint.` });
    } else if (behPts(b) < behMax(b) && !(b.fx && behPts(b))) out.push({ id, gain:gainOf(b), t:b.nome, d: b.step ? `Cada ${brl(b.step)} ${b.unit} vale 1 XPoint.` : b.esforco });
  }
  return out.slice(0, n);
}

// combinações que cabem no saldo total (uma opção por família)
function combos(){
  const tot = total(), res = [];
  const infChoices = (S.scen === 'B' && !elig()) ? [false, true] : [null];
  for (const inf of infChoices){
    const card = inf === true ? 'infinite' : inf === false ? 'one' : activeCard();
    const fs = families(card), base = inf ? P.infPts : 0;
    if (base > tot) continue;
    const rec = (i, picks, cost) => {
      if (i === fs.length){
        const left = tot - cost;
        const maximal = fs.every((f, k) => picks[k] || f.opts[0].price > left);
        if (maximal && (picks.some(Boolean) || inf)) res.push({ inf, card, items: picks.filter(Boolean), cost, left });
        return;
      }
      rec(i + 1, [...picks, null], cost);
      for (const o of fs[i].opts) if (cost + o.price <= tot) rec(i + 1, [...picks, {fam:fs[i].nome, ...o}], cost + o.price);
    };
    rec(0, [], base);
  }
  return res.sort((a,b) => (b.inf===true) - (a.inf===true) || b.items.length - a.items.length || a.left - b.left).slice(0, 6);
}

  const steps = [['Planeje sua vida financeira', 'Organize suas contas, seus gastos e seus objetivos.'], ['Comece a poupar', 'Guarde um pouco todo mês, no seu ritmo.'],
    ['Otimize seu dia a dia', 'Faça o seu dinheiro do mês render mais.'], ['Acelere e proteja seus planos', 'Vá mais longe quando fizer sentido para você.']];
  return `<div class="wel"><svg class="art" viewBox="0 0 400 230" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-opacity=".32" stroke-width="1.1">${waves}</svg>

// ---------- Telas ----------
function pkCard(k){
  const c = activeCard(), cur = c === k, ib = investbackNow();
  const col = (lab, val, cond, up, go, max) => `<div class="pc"><span class="pl">${lab}</span><b>${val}</b>${cond ? `<span class="pcnd">${cond}</span>` : ''}${up ? `<em class="up">${up}</em>` : ''}${cur && go ? `<span class="tb" data-a="openfam:${go}">${max ? 'Ver opções' : 'Turbinar'} ›</span>` : ''}</div>`;
  const ibA = cur && S.active.investback && S.active.investback.status === 'active', ibMax = IB[k]().slice(-1)[0].rate, sl = salaNow(k, cur);
  const locked = k === 'infinite' && !cur && S.inf === 'none' && !elig();
  const nil = '<span class="nil">Ainda não ativo</span>';
  let tag, sub = '', foot = '';
  if (k === 'one') tag = chip('Incluído · não usa XPoints', 'y');
  else if (cur){
    tag = infByPoints() ? chip(`${pt(P.infPts)} em uso`, 'use') : chip('Incluído · não usa XPoints', 'y');
    sub = infByPoints() ? 'É seu enquanto os XPoints estiverem em uso' : `É seu por ter ${brl(P.corte)} ou mais investidos`;
  } else if (S.inf === 'requested'){ tag = chip('<i class="spin"></i> Emitindo', 'y'); sub = 'Você segue com o XP One até a ativação'; }
  else if (elig()){ tag = chip('Desbloqueado · você já pode pedir', 'av'); sub = `Liberado pelos seus ${brl(S.auc)} investidos`; }
  else {
    tag = chip(I.lock + ' Bloqueado', 'ghost');
    const can = S.scen === 'B' && available() >= P.infPts;
    const alt = S.scen === 'B' && !can ? ` <span style="color:var(--ya);font-weight:600">· ou ${pt(P.infPts)} (faltam ${P.infPts - available()})</span>` : '';
    const ask = can ? `<span class="tb" style="display:inline-block;margin-top:8px" data-a="sheet:infPts">Pedir com ${pt(P.infPts)} ›</span>` : '';
    foot = S.auc >= P.corte * 0.6
      ? `<div class="prog" style="margin:10px 0 5px"><i style="width:${S.auc / P.corte * 100}%"></i></div><div class="xs mut">Faltam ${brl(P.corte - S.auc)} investidos${alt}</div>${ask}`
      : `<div class="xs mut" style="margin-top:10px">Desbloqueia com ${brl(P.corte)} investidos${alt}</div>${ask}`;
  }
  return `<button class="pk ${cur ? 'cur' : ''} ${locked ? 'lock' : ''}" data-a="go:pacote">
    <div class="row">${plast(k)}<div class="g"><div class="b" style="font-size:16px;margin-bottom:4px">${cardName(k)}</div>${tag}</div></div>
    ${sub ? `<div class="xs mut" style="margin-top:8px">${sub}</div>` : ''}
    ${foot}
    <div class="pcs">
      ${col('Investback', ibA ? pct(ib.rate) : k === 'one' ? nil : '1%', '', ibA && ib.rate >= ibMax ? 'com XPoints' : `até ${pct(ibMax)} com XPoints`, 'investback', ibA && ib.rate >= ibMax)}
      ${col('Salas VIP', sl.n ? `${sl.n} acessos/ano` : nil, '', sl.n ? sl.up : `até ${sl.max} acessos/ano com XPoints`, 'salavip', sl.n >= sl.max)}
    </div>
    <span class="pkl">Ver todos os benefícios do cartão ›</span></button>`;
}
function cardCarousel(){
  const solo = activeCard() === 'infinite', idx = solo ? 0 : (S.pk ?? 0);
  return `<h3 class="sec" style="margin-top:14px">Seu cartão</h3>
    <div class="pks ${solo ? 'solo' : ''}" data-idx="${idx}">${solo ? '' : pkCard('one')}${pkCard('infinite')}</div>
    ${solo ? '' : `<div class="dots"><i class="${idx === 0 ? 'on' : ''}"></i><i class="${idx === 1 ? 'on' : ''}"></i></div>`}`;
}
const home = () => shelf();

    if (elig()) cta = `<button class="btn" data-a="sheet:infReq">Pedir o XP Infinite</button>`;
    else if (S.scen === 'B') cta = available() >= P.infPts ? `<button class="btn" data-a="sheet:infPts">Pedir o XP Infinite com ${pt(P.infPts)}</button>`

      <button class="btn ghost" data-a="sheet:infOff">Voltar para o XP One e liberar ${pt(P.infPts)}</button>`;

      <button class="pillb" data-a="go:shelf">Turbinar com XPoints</button>
    </div>
    <div class="ttabs flat">${['Para você', 'Lojas parceiras', 'Viagem', 'Seguros'].map((t, i) => `<button class="${(S.ctab || 0) === i ? 'on' : ''}" data-a="ctab:${i}">${t}</button>`).join('')}</div>
    ${S.ctab ? `<h3 class="sec2">${['', 'Lojas parceiras', 'Viagem', 'Seguros'][S.ctab]}<span>Benefício exclusivo para clientes XP</span></h3>
      <div class="sels">${[[], ['Moda', 'Eletrônicos', 'Casa'], ['Hotéis', 'Passagens', 'Aluguel de carro'], ['Viagem', 'Compra protegida', 'Garantia estendida']][S.ctab].map((t, i) => tile(t, 'Benefício exclusivo para clientes XP', ['linear-gradient(170deg,#8fa6bd,#3d5066 60%,#0f141b)', 'linear-gradient(170deg,#4a4560,#2a2738 60%,#0d0c12)', 'linear-gradient(170deg,#9fc0c4,#2f6b73 60%,#0b1a1c)'][i])).join('')}</div>` : `
    ${cardAtRisk() ? `<button class="ban warn" data-a="sheet:lossCard"><div class="ic">!</div><div><b>Patrimônio abaixo de ${brl(P.corte)}</b><span>Seu Infinite continua ativo por enquanto.</span><em>Ver como manter ›</em></div></button>` : ''}

    <div class="card">
      <div class="kv"><span>Investback</span><span>${ib.applies ? `${pct(ib.rate)} das compras` : `Até ${pct(IB.one().slice(-1)[0].rate)}<em class="up">com XPoints</em>`}</span></div>

      <div class="card"><i class="lg" style="background:#F2A77E"></i><div class="xs mut">Loja parceira</div><b>Joalheria parceira</b><div class="sm">Investback em dobro</div></div>
      <div class="card"><i class="lg" style="background:#111"></i><div class="xs mut">Loja parceira</div><b>Cafés parceiros</b><div class="sm">Investback em dobro</div></div></div>

    ${accHead('cmp', 'Comparar os dois cartões')}
    <div class="cmp" ${isOpen('cmp') ? '' : 'hidden'}>
      <div></div><div ${cmpCur('one')}>XP One</div><div ${cmpCur('infinite')}>XP Infinite</div>
      <div>Investback</div><div ${cmpCur('one')}>Até 1,1%<br><span class="xs mut">com XPoints</span></div><div ${cmpCur('infinite')}>1%<br><span class="xs mut">já incluído</span></div>
      <div>Investback com XPoints</div><div ${cmpCur('one')}>1,0%</div><div ${cmpCur('infinite')}>1,2% ou 1,5%</div>
      <div>Salas VIP</div><div ${cmpCur('one')}>${salaNow('one').main}<br><span class="xs mut">${salaNow('one').up}</span></div><div ${cmpCur('infinite')}>${salaNow('infinite').main}<br><span class="xs mut">${salaNow('infinite').up}</span></div>
      <div>Como ter</div><div ${cmpCur('one')}>Cartão de entrada</div><div ${cmpCur('infinite')}>${brl(P.corte)} investidos${S.scen === 'B' ? ` ou ${pt(P.infPts)}` : ''}</div>
    </div>`}`;

// régua: uma linha com os pontos da escala; tocar num ponto leva à confirmação
const rgShort = (f, o) => f.id === 'salavip' ? `${o.n} acessos` : f.id === 'corretagem' ? `${o.n} ordens` : o.label.split(' ')[0];
function rgBase(f, card){   // o que o cliente já tem sem usar XPoints
  return f.id === 'investback' ? (baseRate(card) ? pct(baseRate(card)).replace(',0', '') : null)
    : f.id === 'salavip' ? (salaBase(card) ? `${salaBase(card)} acessos` : null)
    : f.id === 'cofrinho' ? `${P.cofBase}%` : null;
}
function regua(f, card = activeCard(), locked = false){
  const a = locked ? null : S.active[f.id], base = rgBase(f, card), org = f.id !== 'corretagem';   // corretagem começa direto na 1ª faixa
  const has = !locked && f.id === 'cofrinho' && S.legacy && !a && S.legRule !== 'migrar';
  const pos = a ? f.opts.findIndex(o => o.id === a.opt) + 1 : has ? 1 : 0;      // 0 = nada com XPoints
  const n = f.opts.length + (org ? 1 : 0), fill = org ? pos / (n - 1) : Math.max(0, pos - 1) / (n - 1);
  return `<div class="rg ${locked ? 'off' : ''}" style="--n:${n}"><div class="rt"><i style="transform:scaleX(${locked ? 0 : fill})"></i></div><div class="rn">
    ${org ? `<button class="nd ${locked ? 'no' : pos ? 'past' : base ? 'cur' : 'here'}" ${a ? `data-a="sheet:deact:${f.id}"` : ''}><i></i><b>${base || (f.id === 'salavip' ? 'Sem acesso' : 'Sem')}</b><span>${base ? 'Incluído' : locked || pos ? '&nbsp;' : 'Hoje'}</span></button>` : ''}
    ${f.opts.map((o, k) => { const i = k + 1, isA = a && a.opt === o.id, m = missing(f.id, o.id);
      const cls = locked ? 'no' : i < pos ? 'past' : i === pos ? 'cur' + (a && a.status === 'processing' ? ' proc' : '') : m ? 'no' : 'av';
      const sub = isA ? (a.status === 'processing' ? 'Ativando…' : 'Em uso') : has && i === 1 ? 'Você já tem' : pt(o.price);
      return `<button class="nd ${cls}" ${locked ? 'data-a="shake"' : `data-a="${isA ? `sheet:deact:${f.id}` : `sheet:confirm:${f.id}:${o.id}`}"`}><i></i><b>${rgShort(f, o)}</b><span>${sub}</span></button>`; }).join('')}
  </div></div>`;
}
function rgState(f, card, locked){
  const a = !locked && S.active[f.id], base = rgBase(f, card);
  if (a) return a.status === 'processing' ? 'Ativando…' : `<b>${rgShort(f, optOf(f.id, a.opt))}</b> em uso`;
  if (locked) return `${base ? `<b>${base}</b> incluído · ` : ''}até ${rgShort(f, f.opts[f.opts.length - 1])} com XPoints`;
  return base ? `<b>${base}</b> incluído` : 'Ainda não ativo';
}
function shelf(){
  const c = activeCard(), fs = families(), F = id => fs.find(f => f.id === id), solo = c === 'infinite', idx = solo ? 0 : (S.pk ?? 0);
  // linha recolhível dentro do cartão: resumo sempre visível, régua ao tocar
  const row = (f, t) => `<div class="rs"><div class="rh"><div class="row" style="gap:10px"><div class="ico" style="width:32px;height:32px;border-radius:10px">${I[f.id]}</div><b>${t}</b></div></div>${regua(f)}</div>`;
  const lrow = (f, t) => `<div class="rs"><div class="rh"><div class="row" style="gap:10px"><div class="ico" style="width:32px;height:32px;border-radius:10px">${I[f.id]}</div><b>${t}</b></div></div>${regua(f, 'infinite', S.inf !== 'active')}</div>`;
  const solocard = (f, t, unit) => `<div class="card"><div class="rh"><div class="row" style="gap:10px"><div class="ico" style="width:32px;height:32px;border-radius:10px">${I[f.id]}</div><b>${t}</b>${unit ? `<em class="xs mut" style="font-style:normal">${unit}</em>` : ''}</div></div>${regua(f)}</div>`;
  const mine = `<div class="pk2 cur">
      <div class="row">${plast(c)}<div class="b g" style="font-size:16px">${cardName(c)}</div>${infByPoints() && S.inf === 'active' ? chip(`${pt(P.infPts)} em uso`, 'use') : chip('Incluído', 'y')}</div>
      ${row(F('investback'), 'Investback')}${row(F('salavip'), 'Salas VIP')}
      <button class="pkl2" data-a="go:pacote">Ver todos os benefícios do cartão ›</button></div>`;
  let inf = '';
  if (!solo){
    const fi = families('infinite'), Fi = id => fi.find(f => f.id === id), can = S.scen === 'B' && S.inf === 'none' && !elig() && available() >= P.infPts;
    const tag = S.inf === 'requested' ? chip('<i class="spin"></i> Emitindo', 'y') : elig() ? chip('Desbloqueado', 'av') : chip(I.lock + ' Bloqueado', 'ghost');
    const foot = S.inf === 'requested' ? '' : elig() ? `<span class="tb" style="display:inline-block;margin-top:12px" data-a="sheet:infReq">Pedir o Cartão XP Infinite ›</span>`
      : `<div class="prog" style="margin:9px 0 4px;height:4px"><i style="width:${S.auc / P.corte * 100}%"></i></div><div class="xs mut">Faltam ${brl(P.corte - S.auc)} investidos${S.scen === 'B' && !can ? ` · ou ${pt(P.infPts)}` : ''}</div>${can ? `<span class="tb" style="display:inline-block;margin-top:8px" data-a="sheet:infPts">Pedir com ${pt(P.infPts)} ›</span>` : ''}`;
    inf = `<div class="pk2 ${S.inf === 'none' && !elig() ? 'lock' : ''}" role="button" tabindex="0" data-a="go:pacote">
      <div class="row">${plast('infinite')}<div class="g"><div class="b" style="font-size:16px;white-space:nowrap">Cartão XP Infinite</div></div>${tag}</div>
      ${foot}${lrow(Fi('investback'), 'Investback')}${lrow(Fi('salavip'), 'Salas VIP')}</div>`;
  }
  const infState = S.inf === 'requested' ? 'Emitindo' : elig() ? 'Você já pode pedir' : S.auc >= P.corte * 0.6 ? `Faltam ${brl(P.corte - S.auc)}` : 'Bloqueado';
  const peek = solo ? '' : idx === 0
    ? `<button class="peek infinite" data-a="pk:1"><i class="pp" style="width:${S.inf === 'none' && !elig() ? Math.min(100, S.auc / P.corte * 100) : 100}%"></i><b>CARTÃO XP INFINITE</b><span class="pt">${S.inf === 'none' && !elig() ? I.lock : ''}${infState}</span></button>`
    : `<button class="peek one" data-a="pk:0"><b>CARTÃO XP ONE</b><span class="pt">Seu cartão</span></button>`;
  return `<div class="stack">${peek}${solo || idx === 0 ? mine : inf}</div>
    ${solocard(F('cofrinho'), 'Cofre XP', '% do CDI')}
    ${solocard(F('corretagem'), 'Corretagem zero', 'por mês')}`;
}

const FAMINFO = {
  cofrinho: () => [`Vale para o dinheiro guardado no Cofre XP.`, `Sem XPoints, o Cofre XP rende ${P.cofBase}% do CDI. Com XPoints, rende mais.`],

  salavip: () => [salaBase(activeCard()) ? `O número escolhido é o total do ano, já contando os ${salaBase(activeCard())} acessos do seu cartão.` : `O número escolhido é o total de acessos no ano.`, `Os acessos valem enquanto o benefício estiver em uso.`],
  corretagem: () => [`O número escolhido é quantas ordens por mês saem sem corretagem.`, P.corrCob + '.', `Vale enquanto o benefício estiver ativo.`],

  const c = activeCard();
  return `
    <div class="row"><div class="ico" style="width:46px;height:46px">${I[f.id]}</div><div class="g"><div class="sm mut">${f.desc}</div></div></div>
    <div class="split" style="margin-top:12px"><div><span>${sel ? 'Custo' : 'A partir de'}</span><b>${pt(sel ? f.opts.find(o => o.id === sel).price : f.opts[0].price)}</b></div><div><span><i class="d g"></i>Disponíveis</span><b>${pt(available())}</b></div></div>

    const mark = full ? '<i class="mk on">✓</i>' : p ? '<i class="mk part">…</i>' : '<i class="mk off"></i>';

    const right = b.dyn || (byVal && p) ? `<span class="rv ${p ? 'on' : ''}">${p} de ${max}</span>` : full ? `<span class="rv on">${pt(p)}</span>` : b.need ? '' : `<span class="rv">${byVal ? 'até ' + max : '+' + b.pts}</span>`;

  }
  return `<div class="ov" data-a="close"><div class="sheet" data-stop><i class="grab"></i>${h}</div></div>`;
}

let lastKey = '', prevBal = null, justOpen = null;
function renderPhone(){
  const app = document.getElementById('app');
  if (S.screen === 'welcome'){ app.innerHTML = welcome(); lastKey = 'welcome'; return; }
  const isHub = ['home', 'shelf', 'juntar'].includes(S.screen);
  const key = S.screen + ':' + (S.param || '');
  const old = app.querySelector('.scr'), st = old && key === lastKey ? old.scrollTop : 0;
  const body = { home, pacote, shelf, juntar, fam: famScreen }[S.screen]();
  const hadSheet = !!app.querySelector('.ov');
  const cta = isHub && S.screen !== 'shelf' && canActivate() ? `<button class="go" data-a="go:shelf"><span>Você tem benefícios para ativar</span><span>›</span></button>` : '';
  app.innerHTML = `<div class="hd"><button class="back" data-a="back">←</button><h1>${isHub ? 'Jornada XP' : S.screen === 'fam' ? fam(S.param).nome : ''}</h1></div>
    <div class="scr ${key !== lastKey ? 'enter' : ''} ${lastKey === 'shelf:' && S.screen === 'juntar' ? 'from-r' : lastKey === 'juntar:' && S.screen === 'shelf' ? 'from-l' : ''} ${isHub ? 'hubv' : 'sub'} s-${S.screen}">${isHub ? bal() + banners() + cta + hubTabs() : ''}${body}</div>
    ${S.screen === 'fam' ? famFoot() : ''}
    ${sheet()}`;
  app.querySelector('.scr').scrollTop = st; lastKey = key;
  const pks = app.querySelector('.pks');
  if (pks){
    const w = () => pks.firstElementChild.offsetWidth + 10;
    pks.scrollLeft = +pks.dataset.idx * w();
    const flow = () => { const mid = pks.scrollLeft + pks.clientWidth / 2;
      for (const c of pks.children){ const d = Math.max(-1, Math.min(1, (c.offsetLeft + c.offsetWidth / 2 - mid) / c.offsetWidth));
        c.style.transform = `perspective(900px) rotateY(${(-d * 14).toFixed(1)}deg) scale(${(1 - Math.abs(d) * 0.09).toFixed(3)})`; c.style.opacity = (1 - Math.abs(d) * 0.45).toFixed(2); } };
    flow();
    pks.addEventListener('scroll', () => { flow(); const i = Math.round(pks.scrollLeft / w()); S.pk = i;
      app.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i)); }, { passive: true });
  }
  // contador e barra do saldo animam quando o valor muda
  const cnt = app.querySelector('.bal .cnt');
  if (cnt){
    const els = [['.bu', 'transform'], ['.ba', 'transform']].map(([q, k]) => [app.querySelector('.bal ' + q), k]);
    const now = { t: total(), v: els.map(([el, k]) => el.style[k]) };
    if (prevBal && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      if (prevBal.v.join() !== now.v.join()){ els.forEach(([el, k], n) => { el.style[k] = prevBal.v[n]; }); void cnt.offsetWidth; els.forEach(([el, k], n) => { el.style[k] = now.v[n]; }); }
      if (prevBal.t !== now.t){ const from = prevBal.t, t0 = performance.now();
        const tick = ts => { const k = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - k, 3); if (!cnt.isConnected) return;
          cnt.textContent = Math.round(from + (now.t - from) * e); if (k < 1) requestAnimationFrame(tick); };
        cnt.textContent = from; requestAnimationFrame(tick); }
    }
    prevBal = now;
  }
  S.fx = false;
  if (hadSheet && S.sheet){ const ov = app.querySelector('.ov'); ov.style.animation = 'none'; ov.firstElementChild.style.animation = 'none'; }
}
